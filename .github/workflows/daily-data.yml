name: Update daily data

on:
  schedule:
    # 21:30 and 23:00 Taipei, Mon-Fri (TWSE/TPEx publish margin data in the evening)
    - cron: '30 13 * * 1-5'
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/margin.py
      - run: python scripts/volume_profile.py
      - name: Commit if changed
        run: |
          if git diff --quiet docs/margin.json docs/volume_profile.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/margin.json docs/volume_profile.json
          git commit -m "Update daily data"
          git push
