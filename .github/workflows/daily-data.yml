name: Update daily data

on:
  schedule:
    # 21:30 and 23:00 Taipei, Mon-Fri (TWSE publishes margin data in the evening)
    - cron: '30 13 * * 1-5'
    - cron: '0 15 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/daily-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Each script is independent; one failing should not block the others.
      - run: python scripts/margin.py
        continue-on-error: true
      - run: python scripts/volume_profile.py
        continue-on-error: true
      - run: python scripts/institutional_history.py
        continue-on-error: true
      - run: python scripts/taiex_history.py
        continue-on-error: true
      - run: python scripts/vix_history.py
        continue-on-error: true
      - run: python scripts/tsmc_weight.py
        continue-on-error: true
      - run: pip install holidays
        continue-on-error: true
      - run: python scripts/build_events.py
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Commit if changed
        run: |
          FILES="docs/margin.json docs/volume_profile.json docs/events.json docs/institutional.json docs/taiex_history.json docs/vix_history.json docs/tsmc_weight.json"
          if git diff --quiet $FILES; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Update daily data"
          git pull --rebase
          git push
