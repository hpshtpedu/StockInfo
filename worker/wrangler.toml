name = "stockinfo-quotes"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# 只允許自己的 GitHub Pages 從瀏覽器呼叫
ALLOWED_ORIGIN = "https://hpshtpedu.github.io"
# 台股競猜同步金鑰的 SHA-256（scripts/make_guess_sync.py 產生；不是密碼，公開沒關係）
GUESS_SYNC_HASH = ""

# 新聞快訊的清單：全球共用一份（所有機房、手機電腦看到同一份），30 分鐘更新一次
[[kv_namespaces]]
binding = "NEWS_KV"
id = "409d5e1840404fd48b345809fbfdd11b"

# 颱風停班檢查（UTC）：每晚台北 21:30 一次。只在 4/1～10/31 真的去查（程式裡判斷）
[triggers]
crons = ["30 13 * * *"]
