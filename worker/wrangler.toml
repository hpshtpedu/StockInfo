name = "stockinfo-quotes"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# 只允許自己的 GitHub Pages 從瀏覽器呼叫
ALLOWED_ORIGIN = "https://hpshtpedu.github.io"

# 新聞快訊的清單：全球共用一份（所有機房、手機電腦看到同一份），30 分鐘更新一次
[[kv_namespaces]]
binding = "NEWS_KV"
id = "409d5e1840404fd48b345809fbfdd11b"

# 颱風停班檢查（UTC）：台北 20:30、21:30、22:30、04:45。只在 4/1～10/31 真的去查（程式裡判斷）
[triggers]
crons = ["30 12-14 * * *", "45 20 * * *"]
