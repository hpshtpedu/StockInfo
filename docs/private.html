<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>股市大局觀</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #191c22;
    --text: #eef0f3;
    --muted: #8b93a1;
    --line: #2a2f38;
    --warn: #e0a84a;
    --btn: #2b4166;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
    padding: max(12px, env(safe-area-inset-top)) 12px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif; font-size: 24px; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .row label { width: 4.5em; font-weight: 700; }
  input {
    flex: 1; min-width: 0; font: inherit; font-size: 17px; color: var(--text); background: #20242c;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  .unit { color: var(--muted); }
  .row.sub { margin-top: -2px; margin-bottom: 14px; }
  .row.sub label { font-weight: 400; color: var(--muted); font-size: 14px; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  button { font: inherit; font-weight: 600; color: var(--text); background: var(--btn); border: 0; border-radius: 8px; padding: 9px 14px; }
  button.plain { background: #363c48; }
  .msg { color: var(--warn); min-height: 1.4em; margin-top: 8px; }
  .note { color: var(--muted); font-size: 13px; margin-top: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>股市大局觀</h1>

  <form id="login" class="card" hidden>
    <div class="row"><input id="pw" type="password" autocomplete="current-password" placeholder="密碼"></div>
    <div class="btns"><button type="submit">確認</button><button type="button" class="plain" id="back1">返回</button></div>
    <div class="msg" id="loginMsg"></div>
  </form>

  <form id="lots" class="card" hidden>
    <div id="fields"></div>
    <div class="btns">
      <button type="submit">確認並返回首頁</button>
      <button type="button" class="plain" id="lockBtn">鎖定</button>
    </div>
    <div class="msg" id="lotsMsg"></div>
    <div class="note">單位是「張」，0 代表沒有；零股可填到小數 3 位（0.001 張＝1 股）。兩平價選填，填券商 App 的「損益兩平價」（含手續費、稅），首頁就會多一個總損益。張數和兩平價只加密存在這個瀏覽器，換手機或電腦要重新設定。</div>
  </form>

  <div id="noSetup" class="card" hidden>
    尚未設定密碼：請在電腦上執行 <code>python scripts/make_private_verifier.py</code>，把產生的 docs/private-verifier.json 推上去。
  </div>
</main>
<script src="private-vault.js?v=2"></script>
<script>
  const PV = window.PrivateVault;
  const $ = (id) => document.getElementById(id);
  const home = () => { location.href = 'index.html'; };

  async function showLots() {
    $('login').hidden = true;
    $('lots').hidden = false;
    const lots = (await PV.readLots()) ?? {};
    const cost = lots.cost ?? {};
    $('fields').innerHTML = PV.CODES.map((c) => `<div class="row"><label for="l-${c}">${c}</label>`
      + `<input id="l-${c}" type="number" min="0" step="0.001" inputmode="decimal" value="${Number(lots[c] ?? 0)}"><span class="unit">張</span></div>`
      + `<div class="row sub"><label for="c-${c}">兩平價</label>`
      + `<input id="c-${c}" type="number" min="0" step="any" inputmode="decimal" placeholder="選填" value="${cost[c] ? Number(cost[c]) : ''}"><span class="unit">元</span></div>`).join('');
  }

  $('login').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('loginMsg').textContent = '驗證中…';
    try {
      const ok = await PV.unlock($('pw').value);
      $('pw').value = '';
      if (!ok) { $('loginMsg').textContent = '密碼不正確'; return; }
      $('loginMsg').textContent = '';
      await showLots();
    } catch (err) {
      $('login').hidden = true;
      $('noSetup').hidden = false;
    }
  });

  $('lots').addEventListener('submit', async (e) => {
    e.preventDefault();
    const lots = Object.fromEntries(PV.CODES.map((c) => [c, $(`l-${c}`).value === '' ? 0 : Number($(`l-${c}`).value)]));
    const cost = Object.fromEntries(PV.CODES.map((c) => [c, $(`c-${c}`).value === '' ? 0 : Number($(`c-${c}`).value)]));
    try {
      await PV.saveLots(lots, cost);
      home();
    } catch (err) {
      $('lotsMsg').textContent = err.message || '儲存失敗';
    }
  });

  $('lockBtn').addEventListener('click', () => { PV.lock(); home(); });
  $('back1').addEventListener('click', home);

  (async () => {
    if (PV.unlocked() && (await PV.readLots()) !== null) await showLots();
    else { PV.lock(); $('login').hidden = false; $('pw').focus(); }
  })();
</script>
</body>
</html>
