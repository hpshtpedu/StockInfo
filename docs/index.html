      const when = q.time && q.state !== 'opening' && q.state !== 'holiday' && !(q.state === 'auction' && (!sameDay || q.id === 'txf')) ? (sameDay || STATE_LABELS[q.state] ? hhmm(q.time) : mdhm(q.time)) : '';
      const meta = `<div class="meta">${when}${when ? lag : lag.replace(/^ · /, '')}${stale}</div>`;
      // 台指期：外資淨部位的推估均價（估），只有 status ok 且數字合理才顯示；日期與模型說明放在 title
      const tc0 = q.id === 'txf' && txCost?.status === 'ok' && Number.isFinite(txCost.cost) && txCost.cost > 0
        && (txCost.side === 'short' || txCost.side === 'long') ? txCost : null;
      const tc = tc0 ? txCostToday(tc0, byId.foreignOi) : null;
      // 台指期跟加權同一排：先放一行空白＋淡分隔線（跟加權月／季線那行同高），外資成本放在線下面
      const txLine = tc ? `<div class="txcost" title="${esc(`資料截至 ${tc.asOf}${tc.live ? '（盤後即時推估）' : ''}（結算日 ${tc.cycleStart} 起，依外資淨部位與三日轉倉均價推估，不是真實成本）`)}">`
        + `外資${tc.side === 'short' ? '空' : '多'}單成本 (估)<b>${fmt(Math.round(tc.cost), 0)}</b></div>` : '';
      const pct = `(${sign}${fmt(q.changePct, 2)}%)`;
      // 台指期下半部（淡分隔線下）：外資空單成本 ↔ 60 分K（夜盤＋日盤），兩個都有才能點一下切換
      // 夜盤結束的那天不開市（週末、連假）：日盤那 5 格拿掉，夜盤的 14 根填滿寬度，不會以為右邊還有；開市的日盤一開始就恢復 19 格。
      // 用最後一筆成交時間判斷這場夜盤哪天結束（不用現在時間：週日下午 3 點後會誤以為今晚有夜盤）
      const last = new Date((q.time || Date.now()) + 8 * 3600000);
      const lastMins = last.getUTCHours() * 60 + last.getUTCMinutes();
      const inNight = lastMins >= 15 * 60 || lastMins <= 5 * 60;
      const nightEnd = key(lastMins >= 15 * 60 ? addDays(last, 1) : last);
      const endWd = new Date(`${nightEnd}T00:00:00Z`).getUTCDay();
      const noDaySession = inNight && (endWd === 0 || endWd === 6 || holidays.has(nightEnd));
      const k60 = q.id === 'txf' && q.k60?.some(Boolean) ? miniCandles(noDaySession ? q.k60.slice(0, 14) : q.k60, q.prev) : '';
      const txLower = txLine && k60
        ? `<div class="tw2 sw" data-p="${txKPage}"><div class="k0">${txLine}</div><div class="krow k1">${k60}</div></div>
           <div class="foot tw2-foot" data-p="${txKPage}">${meta}<span class="klabel k1">60分K</span></div>`
        : txLine ? `<div class="tw2">${txLine}</div>${meta}`
        : k60 ? `<div class="tw2"><div class="krow">${k60}</div></div><div class="foot">${meta}<span class="klabel">60分K</span></div>`
        : meta;
      // 有 K 線的卡片（加權 15 分 K）：K 線獨立一整行，最下面一列左邊時間、右邊「15分K」
      const body = chart
        ? `<div class="chg ${dir}">${sign}${fmt(q.change, q.digits)} ${pct}</div>
           ${q.id === 'twii'
             // 加權：點 K 線在 15 分 K ↔ 週 K 之間切換，右下標示跟著換
             ? `<div class="kw" data-p="${taiexKPage}"><div class="krow k0">${chart}</div><div class="krow k1">${weeklyCandles(q, undefined, undefined, twiiNearerMa(q))}</div></div>
           <div class="foot kw-foot" data-p="${taiexKPage}">${meta}<span class="klabel k0">15分K</span><span class="klabel k1">週K · ${twiiNearerMa(q) === 60 ? '季線' : '月線'}</span></div>`
             : `<div class="krow">${chart}</div>
           <div class="foot">${meta}</div>`}`
        : `<div class="chg ${dir}">${q.unit === 'yield'
            ? `${sign}${fmt(q.change * 100, 1)}bp`
            : `${sign}${fmt(q.change, q.digits)} ${pct}`}</div>
           ${txLower}`;
      return `
        <div class="card${chart ? ' has-k' : ''}${q.id === 'txf' ? ' txf' : q.id === 'twii' ? ' twii' : MARKET_OF[q.id] !== 'tw' ? ' intl' : ''}">
          <div class="head"><div class="name">${q.name}</div>${badges[q.id] ?? ''}</div>
          <div class="price">${fmt(q.price, q.digits)}${q.unit === 'yield' ? '%' : ''}</div>
          ${body}
        </div>`;
    };
    const gameOn = !!account;  // 小遊戲：登入（私人頁解鎖）才有
    $list.innerHTML = calendarHtml() + jin10Html(data.jin10) + (gameOn ? '<div id="game-slot"></div>' : '')
      + quotes.map((q) => (before[q.id] ?? '') + cardFor(q) + (after[q.id] ?? '')).join('')
      + (margin ? marginHtml(margin) + marginBalanceHtml(margin) : '');
    if (gameOn) attachGame({ twii: byId.twii, tsmc: data.holdings?.find((h) => h.code === '2330'), tradingDay: !isMarketHoliday('tw'),
      isTradingDay: (ymd) => { const wd = new Date(ymd + 'T00:00:00Z').getUTCDay(); return wd !== 0 && wd !== 6 && !holidays.has(ymd); } });
    applyCollapsed();
    fitNames();
    markPending();
    scheduleRead();
  }

  // 台股盤後「還沒開獎」：交易日 13:30 後，卡片的「M/D 盤後」還不是今天 → 蓋一層半透明鋼琴烤漆，資料一更新就拿掉
  function markPending() {
    const tw = new Date(Date.now() + 8 * 3600000);
    const due = !isMarketHoliday('tw') && tw.getUTCHours() * 60 + tw.getUTCMinutes() >= 13 * 60 + 30;
    const today = `${tw.getUTCMonth() + 1}/${tw.getUTCDate()}`;
    for (const card of $list.querySelectorAll('.card')) {
      const m = [...card.querySelectorAll('.meta')].map((x) => x.textContent).join(' ').match(/(\d+\/\d+) 盤後/);
      card.classList.toggle('pend', due && !!m && m[1] !== today);
    }
  }

  let lastLoad = 0;
  let loadRetried = false;
  async function load() {
    lastLoad = Date.now();
    // 請求最多等 30 秒：手機休眠／換網路時連線可能卡住永遠不回來
    const signal = typeof AbortSignal.timeout === 'function' ? AbortSignal.timeout(30000) : undefined;
    try {
      // 網址帶上每 2 分鐘換一次的參數：GitHub Pages 的 CDN 每個節點會快取檔案約 10 分鐘，
      // 手機和電腦連到不同節點時會一新一舊（10/15 八大就這樣）；換參數就一定拿到最新的檔案
      const bust = Math.floor(Date.now() / POLL_MS);
      const getJson = (url) => fetch(`${url}?v=${bust}`, { cache: 'no-store', signal }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
      const marginReq = getJson('margin.json');
      const profileReq = getJson('volume_profile.json');
      const eventsReq = getJson('events.json');
      const historyReq = getJson('institutional.json');
      const taiexReq = getJson('taiex_history.json');
      const vixReq = getJson('vix_history.json');
      const weightReq = getJson('tsmc_weight.json');
      const globalReq = getJson('global_history.json');
      const govReq = getJson('gov_banks.json');
      const recordsReq = getJson('foreign_records.json');
      const txCostReq = getJson('tx_cost.json');
      const yieldReq = getJson('etf_yield.json');
      const res = await fetch(API, { cache: 'no-store', signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const events = await eventsReq;
      if (events) {
        econEvents = {};
        for (const e of events) (econEvents[e.date] ??= []).push(e);
      }
      instHistory = (await historyReq) ?? instHistory;
      taiexHistory = (await taiexReq) ?? taiexHistory;
      vixHistory = (await vixReq) ?? vixHistory;
      tsmcWeight = (await weightReq) ?? tsmcWeight;
      globalHistory = (await globalReq) ?? globalHistory;
      govBanks = (await govReq) ?? govBanks;
      foreignRecords = (await recordsReq) ?? foreignRecords;
      txCost = (await txCostReq) ?? txCost;
      etfYield = (await yieldReq) ?? etfYield;
      volumeProfile = (await profileReq) ?? volumeProfile;
      render(data, pickMargin(data.margin, await marginReq), await profileReq);
      $status.className = '';
      $status.textContent = `更新 ${hhmm(data.updated)} (GMT+8)`;
      loadRetried = false;
    } catch (err) {
      // 閒置很久回來的第一個請求，Worker 要從頭重抓，偶爾會逾時：先不報錯，3 秒後再試一次，再失敗才顯示
      if (!loadRetried) {
        loadRetried = true;
        $status.className = '';
        $status.textContent = '更新中…';
        setTimeout(load, 3000);
        return;
      }
      loadRetried = false;
      $status.className = 'err';
      $status.textContent = `更新失敗：${err.message}`;
    }
  }

  function start() {
    stop();
    if (Date.now() - lastLoad > 5000) { load(); guessSync(); }  // 幾個喚醒事件常一起觸發，5 秒內只抓一次
    timer = setInterval(load, POLL_MS);
  }

  function stop() {
    if (timer) clearInterval(timer);
    timer = null;
  }

  // 手機切到背景就停止輪詢，回來時立刻更新
  // 金十卡片：點一下換下一則
  $list.addEventListener('click', (e) => {
    const card = e.target.closest('.pager');
    if (!card) return;
    jin10Page = (Number(card.dataset.p) + 1) % Number(card.dataset.n);
    card.dataset.p = jin10Page;
    jin10Key = jin10Keys[jin10Page] ?? null;
    scheduleRead();
  });
  // 自選股方塊下半部：點一下換下一頁（K 線或外資、投信 → 公股 → 月季線／殖利率／複利差）
  $list.addEventListener('click', (e) => {
    const g = e.target.closest('[data-guess]');
    if (g) {
      const account = window.PrivateVault?.profile?.();
      const tw = new Date(Date.now() + 8 * 3600000);
      if (account === 'owner' && guessOpen(tw.getUTCHours() * 60 + tw.getUTCMinutes())) {  // 09:00 後按到舊畫面的按鈕不算
        const picks = guessPicks(account);
        picks[tw.toISOString().slice(0, 10)] = g.dataset.guess;
        try { localStorage.setItem(GUESS_KEY(account), JSON.stringify(picks)); } catch {}
        guessSync(g.dataset.guess);
      }
      if (lastRenderArgs) render(...lastRenderArgs);
      return;
    }
    const tw2 = e.target.closest('.tw2.sw');
    if (tw2) {
      txKPage = 1 - txKPage;
      tw2.dataset.p = txKPage;
      tw2.parentElement.querySelector('.tw2-foot').dataset.p = txKPage;
      return;
    }
    const kw = e.target.closest('.kw');
    if (kw) {
      const p = (taiexKPage = 1 - taiexKPage);
      kw.dataset.p = p;
      kw.parentElement.querySelector('.kw-foot').dataset.p = p;
      return;
    }
    const w = e.target.closest('.tsw');
    if (!w) return;
    lowerPage[w.dataset.code] = ((lowerPage[w.dataset.code] ?? 0) + 1) % Number(w.dataset.n || 2);
    w.dataset.p = lowerPage[w.dataset.code];
  });
  $list.addEventListener('click', (e) => {
    const sec = e.target.closest('.section');
    if (!sec) return;
    const name = sec.dataset.sec;
    if (collapsed.has(name)) collapsed.delete(name); else collapsed.add(name);
    try { localStorage.setItem('collapsedSections', JSON.stringify([...collapsed])); } catch {}
    applyCollapsed();
    if (!collapsed.has(name)) fitNames();  // 展開後重新量字寬（收合時量不到）
  });
  document.getElementById('ju')?.addEventListener('click', () => { location.href = 'private.html'; });
  // 切到背景超過 5 分鐘再回來：新聞快訊回到第 1 頁（最新那則）；平常 2 分鐘一次的更新不動你正在看的頁
  let hiddenAt = null;
  const backFromIdle = () => {
    if (hiddenAt && Date.now() - hiddenAt > 5 * 60000) { jin10Page = 0; jin10Key = null; }
    hiddenAt = null;
  };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); stop(); } else { backFromIdle(); start(); }
  });
  // 在背景很久（分頁休眠、iOS 從多工畫面回來、bfcache 還原）時 visibilitychange 不一定會觸發，
  // 輪詢就一直停著：這些事件也當成「回到前景」，立刻更新並重新開始輪詢
  const wake = () => { if (!document.hidden) { backFromIdle(); start(); } };
  for (const ev of ['pageshow', 'focus', 'online']) window.addEventListener(ev, wake);
  document.addEventListener('resume', wake);
  $list.innerHTML = calendarHtml();
  start();
</script>
</body>
