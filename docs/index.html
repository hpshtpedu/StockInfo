<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>股市大局觀</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --card: #191c22;
    --text: #eef0f3;
    --muted: #8b93a1;
    --line: #2a2f38;
    --up: #ff5c5c;
    --down: #2fc27f;
    --warn: #e0a84a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
    padding: max(12px, env(safe-area-inset-top)) 12px max(24px, env(safe-area-inset-bottom));
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    max-width: 560px;
    margin: 0 auto 12px;
  }
  h1 { font-size: 20px; margin: 0; white-space: nowrap; }
  h1 { line-height: 1.2; }
  #source { color: var(--muted); font-size: 11px; line-height: 1.35; }
  .right { color: var(--muted); font-size: 11px; line-height: 1.35; text-align: right; white-space: nowrap; }
  #status.err { color: var(--warn); }
  main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; max-width: 560px; margin: 0 auto; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 7px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    overflow: hidden;
  }
  /* 行情卡片的框：內容出錯也只會被裁掉，不會把卡片撐大 */
  .card:not(.cal) { max-height: 160px; }
  /* 產業成交比重：全寬，兩欄四行 */
  .card.wide { grid-column: 1 / -1; max-height: 170px; gap: 4px; }
  .card.wide .head .meta { flex-shrink: 1; min-width: 0; }
  .head-left { display: flex; align-items: center; gap: 4px; min-width: 0; }
  /* 先排左欄 1-4 名，再排右欄 5-8 名 */
  .secs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(4, auto); grid-auto-flow: column; gap: 5px 14px; }
  .sec-row { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; white-space: nowrap; }
  .sec-row b { font-variant-numeric: tabular-nums; }
  .sec-bar { height: 3px; margin-top: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .sec-bar i { display: block; height: 100%; background: var(--warn); }
  /* 最後一行（時間）貼齊卡片底部，同一排的時間才會對齊 */
  .card:not(.cal) > :last-child { margin-top: auto; }
  /* 加權卡片（有 K 線）：漲跌幅要緊接在漲跌下面，不把最後一列推到底 */
  /* 加權的 15 分 K：整行寬，上下跟文字隔開；「15分K」放在時間那一行的最右邊 */
  .krow { margin: 8px 0 4px; }
  .card.has-k .foot { align-items: center; }
  .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .price { font-size: clamp(17px, 5.2vw, 24px); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* 名稱優先完整顯示，空間不夠時截斷 badge */
  .head { display: flex; align-items: center; justify-content: space-between; gap: 2px; min-width: 0; }
  .head .name { flex-shrink: 0; }
  .badge.warn { background: var(--warn); color: var(--bg); }
  /* 全英文大寫的 badge 看起來比中文大，縮小約 10% 讓視覺一致 */
  .badge.latin { font-size: clamp(9px, 2.9vw, 11px); line-height: 1.65; }  /* 行高放大，badge 高度不變 */
  .badge.fuel, .badge.sell { background: var(--down); color: var(--bg); }
  .badge.buy { background: var(--up); color: var(--bg); }
  .heat { color: var(--warn); }
  .cool { color: #5b8fd6; }
  .ma-row { display: flex; justify-content: space-between; gap: 6px; font-size: clamp(11.5px, 3.4vw, 13px); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ma-row .k { font-size: inherit; }
  /* 我的持股：代號靠左、價格靠右（紅綠表示漲跌）；限制寬度，PC 上才不會拉得太開 */
  /* 四檔共用一個格線：股號欄以最長的為準，價格緊接在後並靠右對齊；漲跌幅放最右邊、小一號 */
  .holds { display: grid; grid-template-columns: auto auto 1fr; column-gap: 8px; row-gap: 2px;
    font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hold-row { display: contents; }
  .hold-row .k { color: var(--text); }
  .hold-row b { text-align: right; }
  .hold-row .ext { display: none; text-align: right; }
  .hold-row .pct { text-align: right; font-size: 11px; font-weight: 600; align-self: center; }
  /* 太窄的手機放不下就不顯示漲跌幅 */
  @media (max-width: 299px) {
    /* 隱藏漲跌幅時改成兩欄（否則每檔只剩兩格會錯開），且欄位不撐開，價格緊接股號 */
    .holds { grid-template-columns: auto auto; justify-content: start; }
    .hold-row .pct { display: none; }
  }
  /* 量能：避開漲跌用的紅綠，冷暖色階 量縮藍 → 正常灰 → 放量黃 → 爆量橘 */
  .badge.vol-low { background: #5b8fd6; color: var(--bg); }
  .badge.vol-high { background: #d9c44a; color: var(--bg); }
  .badge.vol-hot { background: var(--warn); color: var(--bg); }
  /* 最下面一行：左邊報價時間，右邊「15分K」標示 */
  .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 2px; min-width: 0; }
  .foot-left { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  /* 說明用的中性 badge（例如融資維持率的警戒線），放卡片右下角 */
  .foot .badge.warn { flex-shrink: 0; }
  .badge.note { color: var(--muted); }
  .foot .badge.note { flex-shrink: 0; }
  .klabel { flex-shrink: 0; color: var(--muted); font-size: 9px; }
  .kchart { width: 100%; height: 30px; display: block; }
  .badge { min-width: 0; font-size: clamp(10px, 3.2vw, 12px); font-weight: 600; line-height: 1.5; padding: 0 3px; letter-spacing: -0.2px; border-radius: 999px; background: var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .chg { font-size: clamp(11.5px, 3.4vw, 13px); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .price small { font-size: 13px; font-weight: 600; }
  .price.tight { font-size: clamp(16px, 4.6vw, 22px); }
  .seg + .seg { margin-left: 10px; }
  /* 漲跌家數第二行：標籤細字、數字粗體，間距收緊才放得下三位數的平盤家數 */
  .brd .seg + .seg { margin-left: 8px; }
  .brd i { font-style: normal; font-weight: 400; margin-right: 1px; }
  .seg .k { color: var(--muted); font-weight: 400; margin-right: 2px; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .meta { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lag { color: var(--warn); }
  .txt { color: var(--text); }
  .cmp { font-size: clamp(12px, 3.5vw, 13.5px); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .cmp .txt, .chg .txt { font-weight: 400; }
  .error { color: var(--warn); font-size: 12px; }
  .cal { grid-column: 1 / -1; font-size: 13px; gap: 3px; }
  /* 懸掛縮排：圖示獨立一欄，換行文字對齊「今」；明日行用隱形圖示佔位，跟「今」對齊 */
  .cal .today, .cal .next { display: flex; gap: 4px; }
  .cal .ico { flex-shrink: 0; font-size: 13px; }
  .cal .next .ico { visibility: hidden; }
  .cal .today { font-weight: 600; }
  .cal .today b { color: var(--warn); }
  .cal .next { color: var(--muted); font-size: 12px; }
  .cal .next b { color: inherit; font-weight: 400; }
  .cal .ev { color: var(--text); font-weight: 600; }
  .cal .next .ev { color: inherit; font-weight: 400; }
  /* 三大法人：外框一個，標題列與數字區之間橫線、標題與連買連賣之間直線，數字欄不分隔 */
  .cal .inst-box { margin-top: 6px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .cal .inst-title { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; color: var(--muted);
    font-size: 13px; border-bottom: 1px solid var(--line); }
  /* 標題橫跨前三欄置中（中心正好在「投信」上方），連買連賣對齊「合計」 */
  .cal .inst-title > span { padding: 3px 2px; white-space: nowrap; }
  .cal .inst-title > span:first-child { grid-column: 1 / span 3; }
  .cal .inst-title > span:nth-child(2) { font-weight: 600; border-left: 1px solid var(--line); }
  .cal .inst { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; padding: 3px 0 4px; }
  .cal .inst .k { color: var(--muted); font-size: 11px; }
  .cal .inst .v { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  /* 非當日（盤中、隔天早上前）的舊資料：整塊轉灰 */
  .cal .inst.stale .v { color: var(--muted); font-weight: 600; }
  /* 八大行庫：跟三大法人同樣的框，內容只有「合計 +136.1」一行，置中 */
  .cal .inst-box.gov .inst { display: flex; justify-content: center; align-items: baseline; gap: 6px; }
  .cal .inst-box.gov .inst .k { font-size: 14px; }  /* 跟金額同字級，同一行才不會一大一小 */
  /* 當日新資料：標題和欄位名稱用一般白字；舊資料維持灰色 */
  .cal .inst-box.fresh .inst-title, .cal .inst-box.fresh .inst .k { color: var(--text); }
  .cal .inst-box.fresh, .cal .inst-box.fresh .inst-title, .cal .inst-box.fresh .inst-title > span:nth-child(2) { border-color: var(--text); }
  /* 放在最後，才能覆蓋上面的基本尺寸 */
  /* PC／平板橫放（寬度 ≥ 600px）：持股多顯示漲跌和漲跌幅、K 線放大，卡片才不會太空 */
  @media (min-width: 600px) {
    .holds { grid-template-columns: auto auto 1fr auto; }
    .hold-row .ext { display: block; }
    .hold-row .pct { font-size: inherit; min-width: 4.8em; }
    /* 加權的 15 分 K 在 PC 上放大，卡片高度上限跟著放寬 */
    .kchart { height: 40px; }
    .card:not(.cal) { max-height: 176px; }
  }
  /* 窄螢幕（例如 iPhone 開「顯示器放大」約 320px）：邊距收窄、持股字小一號，漲跌幅才放得下 */
  @media (max-width: 359px) {
    body { padding-left: 8px; padding-right: 8px; }
    main { gap: 4px; }
    .card { padding-left: 6px; padding-right: 6px; }
    .holds { column-gap: 5px; font-size: 13px; }
    .hold-row .pct { font-size: 10.5px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>股市大局觀</h1>
    <div id="source">來源：Yahoo、富果、證交所、期交所、HiStock</div>
  </div>
  <div class="right">
    <div id="status">載入中…</div>
    <div>每2分鐘更新</div>
  </div>
</header>
<main id="list"></main>
<script>
  const API = 'https://stockinfo-quotes.hpshtpedu.workers.dev/quotes';
  const POLL_MS = 120 * 1000;
  const STATE_LABELS = { lunch: '午休', closed: '收盤', holiday: '休市', night: '夜盤', opening: '開盤' };
  // 「時間 · 狀態」；休市只寫「休市」（時間是上一個交易日的，沒意義）
  const timeState = (time, state) => (state === 'holiday' ? '休市'
    : `${hhmm(time)}${STATE_LABELS[state] ? ` · ${STATE_LABELS[state]}` : ''}`);

  const $list = document.getElementById('list');
  const $status = document.getElementById('status');
  let timer = null;

  const fmt = (n, d) => n == null ? '—' : n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const hhmm = (t) => new Date(t).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Taipei' });
  const mdhm = (t) => new Date(t).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Taipei' });

  // ---- 結算行事曆：依規則推算，未扣除國定假日順延 ----
  const WEEKDAYS = '日一二三四五六';
  const QUARTER = [3, 6, 9, 12];

  // 該月第 n 個星期 dow 是幾號
  function nthWeekday(y, m, dow, n) {
    const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
    return 1 + ((dow - first + 7) % 7) + (n - 1) * 7;
  }

  // 台股休市日（證交所公告，由 Worker 提供）：日期 -> 節日名稱
  let holidays = new Map();

  // 日期一律用 UTC 午夜的 Date 表示台北日曆日
  const utcDate = (y, m, d) => new Date(Date.UTC(y, m - 1, d));
  const addDays = (t, n) => new Date(t.getTime() + n * 86400000);
  const key = (t) => t.toISOString().slice(0, 10);
  const isBusinessDay = (t) => t.getUTCDay() !== 0 && t.getUTCDay() !== 6 && !holidays.has(key(t));

  // 期交所：最後交易日遇假日，順延至次一營業日
  function nextBusinessDay(t) {
    while (!isBusinessDay(t)) t = addDays(t, 1);
    return t;
  }

  // 該月倒數第 2 個台股營業日（MSCI/FTSE 遇台灣假日會再往前找）
  function secondLastBusinessDay(y, m) {
    let t = utcDate(y, m + 1, 0);
    for (let count = 0; ; t = addDays(t, -1)) {
      if (isBusinessDay(t) && ++count === 2) return t;
    }
  }

  // 原定到期日 t 的台指結算項目（尚未順延）
  function taifexExpiries(t) {
    const [y, m, d] = [t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()];
    return d === nthWeekday(y, m, 3, 3) ? ['台指期貨＋選擇權月結算'] : [];
  }

  // 台灣與美國的結算
  function settlements(today) {
    const [y, m, d] = [today.getUTCFullYear(), today.getUTCMonth() + 1, today.getUTCDate()];
    const out = [];
    // 回頭看兩週內的原定到期日，順延後落在今天的都算
    for (let back = 0; back <= 14; back++) {
      const base = addDays(today, -back);
      const labels = taifexExpiries(base);
      if (labels.length && key(nextBusinessDay(base)) === key(today)) {
        out.push(...labels.map((l) => (back ? `${l}（假日順延）` : l)));
      }
    }
    // HKEX MSCI 台指 (摩台/MDFK) 與 SGX FTSE 台指 (富台) 同為倒數第 2 個營業日
    if (key(secondLastBusinessDay(y, m)) === key(today)) out.push('MSCI/富時台股期貨結算');
    if (d === nthWeekday(y, m, 5, 3)) out.push(QUARTER.includes(m) ? '美股四巫日（季結算）' : '美股選擇權月結算');
    return [...new Set(out)];
  }

  // 經濟數據、財報等事件（台灣時間），由 scripts/build_events.py 產生 events.json
  let econEvents = {};

  // 證交所的正式節日名稱 -> 一般說法（「補假」後綴會保留）
  const HOLIDAY_SHORT_NAMES = {
    '中華民國開國紀念日': '元旦',
    '農曆除夕及春節': '春節',
    '和平紀念日': '228',
    '兒童節及民族掃墓節': '清明連假',
    '孔子誕辰紀念日/教師節': '教師節',
    '臺灣光復暨金門古寧頭大捷紀念日': '光復節',
  };

  // 平日休市才標示，例如「國慶日補假休市」
  function holidayLabel(t) {
    if (t.getUTCDay() === 0 || t.getUTCDay() === 6 || !holidays.has(key(t))) return '';
    let name = holidays.get(key(t)) || '台股';
    for (const [full, short] of Object.entries(HOLIDAY_SHORT_NAMES)) name = name.replace(full, short);
    return `${name}休市`;
  }

  // 美國的事件（events.json 的來源）—— 對台灣多在半夜，同一天排在最前面
  const US_SOURCES = new Set(['fred', 'fomc', 'ism', 'nvidia']);

  // 每項：{ text, settle: 結算類（橘色）, us: 美國事件 }；美國的排前面，其餘維持原順序
  // Worker 當天抓到的公告：{ date, revenue: { month, yoy, mom }, dividends: [文字] }
  let announcements = null;

  // 台積電月營收：每月 10 日公布上月營收，遇假日提前到前一個營業日
  function tsmcRevenueLabel(t) {
    let day = utcDate(t.getUTCFullYear(), t.getUTCMonth() + 1, 10);
    while (!isBusinessDay(day)) day = addDays(day, -1);
    if (key(day) !== key(t)) return '';
    const month = t.getUTCMonth() === 0 ? 12 : t.getUTCMonth();  // the previous month
    return `台積電${month}月營收`;
  }

  function dayEvents(t) {
    const holiday = holidayLabel(t);
    const items = [
      ...(holiday ? [holiday] : []),
      ...settlements(t),
    ].map((text) => ({ text, settle: true, us: text.startsWith('美股') }));
    for (const e of econEvents[key(t)] ?? []) {
      items.push({ text: e.label, settle: false, us: US_SOURCES.has(e.src) || e.label.startsWith('美股') });
    }
    // 當天抓到的公告（Worker 提供）：營收換成帶年增/月增的版本，另外加上配息公告
    const ann = announcements?.date === key(t) ? announcements : null;
    const revenue = tsmcRevenueLabel(t);
    if (revenue) {
      const r = ann?.revenue;
      const pct = (v) => `<span class="${v > 0 ? 'up' : v < 0 ? 'down' : ''}">${v > 0 ? '+' : ''}${fmt(v, 2)}%</span>`;
      items.push({ text: r ? `台積電${r.month}月營收(YoY ${pct(r.yoy)}, MoM ${pct(r.mom)})` : revenue, settle: false, us: false });
    }
    for (const text of ann?.dividends ?? []) items.push({ text, settle: false, us: false });
    items.sort((a, b) => b.us - a.us);
    return { items, any: items.length > 0 };
  }

  function dayLine(label, t, ev) {
    const parts = ev.items.map((i) => (i.settle ? `<b>${i.text}</b>` : `<span class="ev">${i.text}</span>`)).join('、');
    return `${label} ${t.getUTCMonth() + 1}/${t.getUTCDate()}(${WEEKDAYS[t.getUTCDay()]})${parts ? `　${parts}` : ''}`;
  }

  let instHistory = null;

  // 外資連買/連賣天數：GitHub Actions 每晚記錄的歷史 + Worker 抓到的最新一天
  // 外資連續買（正）或賣（負）超的天數
  function foreignStreakDays(inst, history) {
    if (!inst?.date) return 0;
    const byDate = new Map((history?.days ?? []).map((d) => [d.date, d.foreign]));
    byDate.set(inst.date, inst.foreign);
    const values = [...byDate.entries()].filter(([d]) => d <= inst.date).sort().map(([, v]) => v);
    const sign = Math.sign(values.at(-1) ?? 0);
    let n = 0;
    for (let i = values.length - 1; i >= 0 && sign && Math.sign(values[i]) === sign; i--) n++;
    return sign * n;
  }

  function foreignStreak(inst, history, fresh) {
    const streak = foreignStreakDays(inst, history);
    const sign = Math.sign(streak);
    if (!sign) return '';
    const n = Math.abs(streak);
    // 當日新資料：「連N買」紅、「連N賣」綠，「外資」維持標題色
    const tail = `連${n}${sign > 0 ? '買' : '賣'}`;
    return `<span>外資${fresh ? `<span class="${sign > 0 ? 'up' : 'down'}">${tail}</span>` : tail}</span>`;
  }

  // 三大法人買賣超：一直顯示；當日 15:10 到下個交易日 08:00 是新資料（彩色），其餘時間整塊轉灰
  function institutionalHtml(inst, history) {
    if (!inst?.date) return '';
    const [y, m, d] = inst.date.split('-').map(Number);
    const day = utcDate(y, m, d);
    const freshFrom = day.getTime() + (15 * 60 + 10) * 60000;
    const freshUntil = nextBusinessDay(addDays(day, 1)).getTime() + 8 * 3600000;
    const nowTw = Date.now() + 8 * 3600000;
    const fresh = nowTw >= freshFrom && nowTw < freshUntil;

    const cols = [['外資', inst.foreign], ['投信', inst.trust], ['自營商', inst.dealer], ['合計', inst.total]];
    const header = cols.map(([label]) => `<div class="k">${label}</div>`).join('');
    const values = cols.map(([, v]) => {
      const dir = v > 0 ? 'up' : v < 0 ? 'down' : '';
      return `<div class="v ${dir}">${v > 0 ? '+' : ''}${fmt(v, 1)}</div>`;
    }).join('');
    return `
      <div class="inst-box${fresh ? ' fresh' : ''}">
        <div class="inst-title"><span>三大法人買賣超 ${m}/${d}（億元）</span>${foreignStreak(inst, history, fresh) || '<span></span>'}</div>
        <div class="inst${fresh ? '' : ' stale'}">${header}${values}</div>
      </div>
      ${govBanksBox(inst.date, fresh)}`;
  }

  // 八大公股行庫買賣超（HiStock，每晚抓一次），跟三大法人同樣的框：跟三大法人同一天且在新鮮時段才用白字，
  // 否則灰色。含公股券商的自營與客戶下單，不完全等於國家隊
  function govBanksBox(instDate, instFresh) {
    const days = govBanks?.days ?? [];
    const last = days.at(-1);
    if (!last) return '';
    // 連買/賣：單日不到 10 億（近 60 日約 8% 的日子）視為持平，跳過不算、也不打斷
    const big = days.filter((d) => Math.abs(d.net) >= 10);
    const sign = Math.sign(big.at(-1)?.net ?? 0);
    let n = 0;
    for (let i = big.length - 1; i >= 0 && Math.sign(big[i].net) === sign; i--) n++;
    // 護盤：大盤收跌的日子，官股買超佔當天成交金額 1.9% 以上（成交金額是 volume_profile.json 的
    // 一般交易時段總額，百萬元）。用比例而非固定金額，市場變大變小都適用；近 60 日 5 次，約 8%
    const turnover = volumeProfile?.totals?.[last.date];
    const taiexPct = taiexChangePct(last.date, null);
    const sharePct = turnover ? ((last.net * 100) / turnover) * 100 : 0;  // 億→百萬，再換成 %
    const rescue = sharePct >= 1.9 && taiexPct != null && taiexPct < 0
      ? ' <span class="badge buy">護盤</span>' : '';
    const fresh = instFresh && last.date === instDate;
    const dir = last.net > 0 ? 'up' : 'down';
    const [, mm, dd] = last.date.split('-').map(Number);
    const tail = sign ? `連${n}${sign > 0 ? '買' : '賣'}` : '';
    const tailDir = sign > 0 ? 'up' : 'down';
    return `
      <div class="inst-box gov${fresh ? ' fresh' : ''}">
        <div class="inst-title"><span>八大公股行庫買賣超 ${mm}/${dd}（億元）</span><span>${fresh ? `<span class="${tailDir}">${tail}</span>` : tail}</span></div>
        <div class="inst${fresh ? '' : ' stale'}"><div class="k">合計</div><div class="v ${dir}">${last.net > 0 ? '+' : ''}${fmt(last.net, 1)}</div>${rescue}</div>
      </div>`;
  }

  function calendarHtml(inst, history) {
    const tw = new Date(Date.now() + 8 * 3600 * 1000);
    const today = utcDate(tw.getUTCFullYear(), tw.getUTCMonth() + 1, tw.getUTCDate());
    // 只列明天，沒有事件就不顯示（週一的事件等到週日才出現）
    const tomorrow = addDays(today, 1);
    const nextEvents = dayEvents(tomorrow);
    const nextHtml = nextEvents.any ? `<div class="next"><span class="ico">📅</span><span>${dayLine('明日', tomorrow, nextEvents)}</span></div>` : '';
    return `
      <div class="card cal">
        <div class="today"><span class="ico">📅</span><span>${dayLine('今日', today, dayEvents(today))}</span></div>
        ${nextHtml}
        ${institutionalHtml(inst, history)}
      </div>`;
  }

  // "多1.3萬 空9.2萬" -> 各段拉開間距，標籤字轉灰色
  const segments = (text) => /\d/.test(text)
    ? text.split(' ').map((s) => `<span class="seg">${s.replace(/^([^\d+-]+)/, '<span class="k">$1</span>')}</span>`).join('')
    : text;

  // 淨未平倉從 prev 變成 cur 的白話描述
  function netOiChange(prev, cur) {
    const lots = (n) => `${fmt(Math.abs(n), 0)}口`;
    if (prev < 0 && cur >= 0) return `淨多${lots(cur)}`;  // 翻多
    if (prev >= 0 && cur < 0) return `淨空${lots(cur)}`;  // 翻空
    const side = cur < 0 ? '淨空' : '淨多';
    const grew = Math.abs(cur) > Math.abs(prev);
    return `${side}${grew ? '增' : '減'}${lots(cur - prev)}`;
  }

  // 外資期現同向：同一天現貨賣超 300 億以上、台指淨 OI 又減少 2,000 口以上＝期現雙空；反向＝期現雙多。
  // 門檻約為各自日變動的中位數，盤整時的小額買賣不算
  function futuresSpotBadge(q, inst) {
    if (q.change == null || !inst?.date || !q.time) return '';
    const day = new Date(q.time + 8 * 3600000).toISOString().slice(0, 10);
    if (inst.date !== day) return '';
    if (inst.foreign <= -300 && q.change <= -2000) return '<span class="badge sell">期現雙空</span>';
    if (inst.foreign >= 300 && q.change >= 2000) return '<span class="badge buy">期現雙多</span>';
    return '';
  }

  function dailyHtml(q, inst) {
    const dir = q.price > 0 ? 'up' : q.price < 0 ? 'down' : '';
    const sign = q.price > 0 ? '+' : '';
    const value = q.unit === 'ratio' ? `${sign}${fmt(q.price, q.digits)}%` : `${sign}${fmt(q.price, q.digits)}<small> 口</small>`;
    // 跟前一個交易日比：多空比用百分點；淨 OI 用白話描述（淨空增/減、翻多…），對多方有利紅、不利綠
    // 「較前日」獨立一行，放在日期上方
    let change = '';
    if (q.change != null) {
      const cdir = q.change > 0 ? 'up' : q.change < 0 ? 'down' : '';
      const text = q.unit === 'ratio'
        ? `${q.change > 0 ? '+' : ''}${fmt(q.change, 2)}個百分點`
        : netOiChange(q.price - q.change, q.price);
      change = `<div class="cmp"><span class="txt">較前日</span> <span class="${cdir}">${text}</span></div>`;
    }
    // 散戶多空比是反向指標：一面倒做多＝過熱（橘），一面倒做空＝軋空燃料（綠）
    const badge = q.unit !== 'ratio' ? futuresSpotBadge(q, inst)
      : q.price > 20 ? '<span class="badge warn latin">FOMO</span>'
      : q.price < -20 ? '<span class="badge fuel">燃料充足</span>' : '';
    return `
      <div class="card">
        <div class="head"><div class="name">${q.name}</div>${badge}</div>
        <div class="price ${dir}">${value}</div>
        <div class="chg">${segments(q.detail)}</div>
        ${change}
        <div class="meta">${q.dataDate} 盤後${q.stale ? ' · <span class="lag">舊資料</span>' : ''}</div>
      </div>`;
  }

  // 融資資料：Worker（21:00 後即時）優先；GitHub Actions 產生的 margin.json 當備援，
  // 也用來補 Worker 缺的「前一日維持率」
  function pickMargin(w, f) {
    if (!w) return f;
    if (!f || w.date > f.date) return { ...w, prev: w.prev ?? f?.ratio ?? null, history: f?.history };
    if (w.date === f.date) return { ...w, prev: w.prev ?? f.prev ?? null, history: f.history };
    return f;
  }

  // 融資連續增加/減少的天數（margin.json 的每日增減，Worker 較新的那天補在最後）；2 天以上才顯示
  function marginStreakBadge(m) {
    const days = (m.history ?? []).filter((h) => h.date < m.date).map((h) => h.balanceChange);
    days.push(m.balanceChange);
    const sign = Math.sign(days[days.length - 1]);
    let n = 0;
    while (n < days.length && sign && Math.sign(days[days.length - 1 - n]) === sign) n++;
    if (n < 2) return '';
    return `<span class="badge ${sign > 0 ? 'up' : 'down'}">連${n}${n === days.length ? '+' : ''}${sign > 0 ? '增' : '減'}</span>`;
  }

  // 上市融資維持率
  function marginHtml(m) {
    const [, mm, dd] = m.date.split('-').map(Number);
    let chg = '&nbsp;';
    let dir = '';
    if (m.prev != null) {
      const diff = m.ratio - m.prev;
      dir = diff > 0 ? 'up' : diff < 0 ? 'down' : '';
      chg = `<span class="txt">較前日</span> ${diff > 0 ? '+' : ''}${fmt(diff, 2)}個百分點`;
    }
    return `
      <div class="card">
        <div class="name">上市融資維持率</div>
        <div class="price">${fmt(m.ratio, 2)}%</div>
        <div class="chg ${dir}">${chg}</div>
        <div class="foot"><div class="meta">${mm}/${dd} 盤後</div><span class="badge ${m.ratio < 140 ? 'warn' : 'note'}">警戒線140%</span></div>
      </div>`;
  }

  // 百萬元 -> "9760億" / "1.05兆"（不加千分位，badge 才放得下）
  function money(millions) {
    const yi = millions / 100;
    return yi >= 10000 ? `${(yi / 10000).toFixed(2)}兆` : `${Math.round(yi)}億`;
  }

  // 價差 = 台指期 - 加權指數
  // TSM ADR 溢價率：ADR 換算成台幣每股（1 ADR = 5 股）÷ 2330 − 1；溢價紅、折價綠
  // 每晚存的日收盤（global_history.json）+ 即時報價當最新一天；檔案落後一天時用報價的昨收補上
  function dailySeries(q) {
    const closes = (globalHistory?.[q?.id] ?? []).map((c) => c.close);
    if (!q?.price || !closes.length) return [];
    if (q.prev != null && Math.abs(closes.at(-1) - q.prev) > Math.abs(q.prev) * 1e-6) closes.push(q.prev);
    return [...closes, q.price];
  }

  // 美債 10Y：5 個交易日殖利率上升 20bp 以上＝殖利率急升（壓抑科技股評價）
  function us10yBadge(q) {
    const series = dailySeries(q);
    if (series.length < 6) return '';
    return (series.at(-1) - series.at(-6)) * 100 >= 20 ? '<span class="badge warn">殖利率急升</span>' : '';
  }

  // 國際指數的月線（20 日均線）距離
  function monthLineBadge(q) {
    const series = dailySeries(q).slice(-20);
    if (series.length < 20) return '';
    const ma = series.reduce((a, b) => a + b, 0) / 20;
    const gap = (q.price / ma - 1) * 100;
    return `<span class="badge ${gap > 0 ? 'up' : gap < 0 ? 'down' : ''}">月線${gap > 0 ? '+' : ''}${fmt(gap, 1)}%</span>`;
  }

  // USD/TWD：5 個交易日的變動（每晚存的日收盤 + 即時報價）。台幣貶超過 1% 且外資連賣 3 天以上＝資金外流；
  // 反向＝資金回流；只有匯率大動、外資沒同方向＝台幣急貶/急升（灰）；其他不顯示
  function usdtwdBadge(q, inst, history) {
    const closes = (globalHistory?.usdtwd ?? []).map((c) => c.close);
    if (!q?.price || closes.length < 5) return '';
    const move = (q.price / closes.at(-5) - 1) * 100;  // 正＝美元漲＝台幣貶
    if (Math.abs(move) < 1) return '';
    const streak = foreignStreakDays(inst, history);
    if (move > 0 && streak <= -3) return '<span class="badge warn">資金外流</span>';
    if (move < 0 && streak >= 3) return '<span class="badge buy">資金回流</span>';
    return `<span class="badge note">台幣急${move > 0 ? '貶' : '升'}</span>`;
  }

  function adrBadge(tsm) {
    const p = tsm?.adrPremium;
    if (p == null) return '';
    return `<span class="badge ${p > 0 ? 'up' : p < 0 ? 'down' : ''}">${p >= 0 ? '溢價' : '折價'}${p > 0 ? '+' : ''}${fmt(p, 1)}%</span>`;
  }

  function basisBadge(txf, twii) {
    if (txf?.price == null || twii?.price == null) return '';
    const b = Math.round(txf.price - twii.price);
    const [label, dir] = b > 0 ? ['正價差', 'up'] : b < 0 ? ['逆價差', 'down'] : ['平價', ''];
    return `<span class="badge ${dir}">${label}${b > 0 ? '+' : ''}${b}</span>`;
  }

  // 量能顏色：成交（或估量）÷ 前 5 個交易日平均。≤0.8 量縮灰、≥1.2 放量黃、≥1.5 爆量橘
  function volumeClass(amount, twii, profile) {
    const day = new Date(twii.time + 8 * 3600000).toISOString().slice(0, 10);
    const prior = Object.entries(profile?.totals ?? {}).filter(([d]) => d < day).sort().slice(-5).map(([, v]) => v);
    if (prior.length < 5) return '';
    const ratio = amount / (prior.reduce((a, b) => a + b, 0) / prior.length);
    return ratio >= 1.5 ? ' vol-hot' : ratio >= 1.2 ? ' vol-high' : ratio <= 0.8 ? ' vol-low' : '';
  }

  // 盤中：累積成交金額 ÷ 過去 5 日同一分鐘的成交占比；收盤後：實際成交金額
  function turnoverBadge(twii, profile) {
    if (!twii?.turnover) return '';
    const minute = hhmm(twii.time);
    if (twii.state !== 'open' || minute >= '13:30') {
      return `<span class="badge${volumeClass(twii.turnover, twii, profile)}">成交${money(twii.turnover)}</span>`;
    }
    const share = profile?.share?.[minute];
    if (minute < '09:05' || !share) return '';
    const estimate = twii.turnover / share;
    // 開盤頭 30 分鐘估量誤差大，先不變色
    const cls = minute >= '09:30' ? volumeClass(estimate, twii, profile) : '';
    return `<span class="badge${cls}">估${money(estimate)}</span>`;
  }

  // 漲跌家數：「拉雞盤」＝台積電漲 1% 以上硬扛、加權漲，但扣掉台積電後指數其實沒漲，且下跌家數較多。
  // （台積電漲不到 1% 的牛皮盤不算）
  // 台積電貢獻點數 ≈ 昨收指數 × 台積電市值比重（期交所，每晚更新）× 台積電漲跌幅
  function breadthHtml(q, twii, tw2330) {
    const weight = tsmcWeight?.weight;
    const tsmcPoints = weight && tw2330?.changePct != null && twii?.prev
      ? twii.prev * (weight / 100) * (tw2330.changePct / 100) : null;
    const pulled = twii?.change > 0 && tw2330?.changePct >= 1 && tsmcPoints != null && twii.change - tsmcPoints <= 0 && q.down > q.up;
    const badge = pulled ? '<span class="badge warn">拉雞盤</span>' : '';
    return `
      <div class="card">
        <div class="head"><div class="name">${q.name}</div>${badge}</div>
        <div class="price tight"><span class="up">▲${q.up}</span> <span class="down">▼${q.down}</span></div>
        <div class="chg brd"><span class="seg up"><i>漲停</i>${q.limitUp}</span><span class="seg down"><i>跌停</i>${q.limitDown}</span><span class="seg"><i>平</i>${q.flat}</span></div>
        <div class="meta">${timeState(twii?.time ?? q.time, twii?.state)}</div>
      </div>`;
  }

  // 融資餘額日增減（億元），GitHub Actions 每晚計算
  function marginBalanceHtml(m) {
    if (m?.balanceChange == null) return '';
    const [, mm, dd] = m.date.split('-').map(Number);
    const c = m.balanceChange;
    const dir = c > 0 ? 'up' : c < 0 ? 'down' : '';
    return `
      <div class="card">
        <div class="head"><div class="name">上市融資增減</div>${marginStreakBadge(m)}</div>
        <div class="price ${dir}">${c > 0 ? '+' : ''}${fmt(c, 1)}<small> 億</small></div>
        <div class="chg">${segments(`餘額${fmt(m.balance, 0)}億`)}</div>
        <div class="meta">${mm}/${dd} 盤後</div>
      </div>`;
  }

  // 迷你 15 分 K：18 個時段（09:00-13:30），虛線為昨收
  function miniCandles(candles, prev) {
    const bars = candles.map((c, i) => c && { i, o: c[0], h: c[1], l: c[2], c: c[3] }).filter(Boolean);
    if (!bars.length) return '';
    const lo = Math.min(prev ?? Infinity, ...bars.map((b) => b.l));
    const hi = Math.max(prev ?? -Infinity, ...bars.map((b) => b.h));
    const y = (v) => (hi === lo ? 50 : ((hi - v) / (hi - lo)) * 100);
    const w = 7;
    const parts = bars.map((b) => {
      const color = b.c >= b.o ? 'var(--up)' : 'var(--down)';
      const top = y(Math.max(b.o, b.c));
      const height = Math.max(2, y(Math.min(b.o, b.c)) - top);
      const x = b.i * w;
      return `<line x1="${x + 3.5}" x2="${x + 3.5}" y1="${y(b.h)}" y2="${y(b.l)}" stroke="${color}" vector-effect="non-scaling-stroke"/>`
        + `<rect x="${x + 1.5}" y="${top}" width="4" height="${height}" fill="${color}"/>`;
    });
    const base = prev == null ? '' : `<line x1="0" x2="${candles.length * w}" y1="${y(prev)}" y2="${y(prev)}" stroke="var(--muted)" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>`;
    return `<svg class="kchart" viewBox="0 0 ${candles.length * w} 100" preserveAspectRatio="none" aria-hidden="true">${base}${parts.join('')}</svg>`;
  }

  // 大盤均線：每晚存的加權收盤（taiex_history.json）+ 即時指數當最新一天
  let taiexHistory = null;
  let vixHistory = null;
  let volumeProfile = null;  // 每日成交金額（totals），護盤判斷用
  let govBanks = null;  // 八大公股行庫每日買賣超
  let sectorHistory = null;  // 每日收盤的產業成交比重
  let globalHistory = null;  // 費半、小納、韓股、日經的日收盤，月線 badge 用
  let tsmcWeight = null;  // 台積電市值佔大盤比重（%），拉雞盤判斷用

  // 台指 VIX：每晚累積的歷史（vix_history.json）+ Worker 抓到的最新收盤。
  // 百分位看位置、5 日變化看方向；百分位 ≥90 且當天回落 → 「高檔回落」（今年兩次底部的訊號）
  // 加權在某一天的漲跌幅（%）：每晚的歷史收盤，今天則用即時指數
  function taiexChangePct(date, twii) {
    const byDate = new Map((taiexHistory?.closes ?? []).map((c) => [c.date, c.close]));
    if (twii?.price && new Date(twii.time + 8 * 3600000).toISOString().slice(0, 10) === date) {
      return twii.changePct;
    }
    const dates = [...byDate.keys()].sort();
    const i = dates.indexOf(date);
    return i > 0 ? (byDate.get(date) / byDate.get(dates[i - 1]) - 1) * 100 : null;
  }

  function vixHtml(vix, twii) {
    const byDate = new Map((vixHistory?.closes ?? []).map((c) => [c.date, c.close]));
    for (const c of vix?.closes ?? []) byDate.set(c.date, c.close);
    const series = [...byDate.entries()].sort(([a], [b]) => (a < b ? -1 : 1));
    if (series.length < 6) return '';
    const [lastDate, last] = series.at(-1);
    const prev = series.at(-2)[1];
    const fiveAgo = series.at(-6)[1];
    const change = last - prev;
    const trend = last - fiveAgo;
    // VIX 上升是警訊，不用漲跌的紅綠：升溫橘、降溫藍
    const dir = (v) => (v > 0 ? 'heat' : v < 0 ? 'cool' : '');
    const sign = (v) => (v > 0 ? '+' : '');
    // VIX 超過 40（今年兩次底部都在 40 以上）→ 紅色「買進訊號」，優先；
    // 單日跳升 3 點以上（有人急著買保護）→ 橘色「急升」；
    // 加權漲 0.5% 以上、VIX 卻也漲 1 點以上（漲勢中有人買保護，常是後繼無力）→ 橘色「大盤漲得心虛」
    const taiexPct = taiexChangePct(lastDate, twii);
    const badge = last > 40
      ? '<span class="badge buy">買進訊號</span>'
      : change >= 3
        ? '<span class="badge warn">急升</span>'
        : taiexPct >= 0.5 && change >= 1
          ? '<span class="badge warn">大盤漲得心虛</span>'
          : '';
    const [, mm, dd] = lastDate.split('-').map(Number);
    return `
      <div class="card">
        <div class="head"><div class="name">台指VIX</div>${badge}</div>
        <div class="price">${fmt(last, 2)}</div>
        <div class="chg ${dir(change)}">${sign(change)}${fmt(change, 2)} (${sign(change)}${fmt((change / prev) * 100, 1)}%)</div>
        <div class="cmp"><span class="txt">5日</span> <span class="${dir(trend)}">${trend > 0 ? '升溫' : '降溫'} ${sign(trend)}${fmt(trend, 2)}</span></div>
        <div class="meta">${mm}/${dd} 盤後</div>
      </div>`;
  }

  // 我的持股：代號、價格、漲跌幅
  // 正二磨損：00685L 近 20 個交易日的實際漲跌，減掉「加權同期漲跌 × 2」（百分點）。
  // 震盪盤每天重新槓桿會吃掉報酬；近一年約 10% 的日子 ≤ -3%，這時才警示。
  // 反過來單邊趨勢時複利會超過 2 倍；正向差距比較小，近一年約 10% 的日子 ≥ +1%
  function leverageDecay(list, twii) {
    const etf = list.find((h) => h.code === '00685L');
    if (!etf?.price || !twii?.price) return null;
    const idx = new Map((taiexHistory?.closes ?? []).map((c) => [c.date, c.close]));
    const day = new Date(twii.time + 8 * 3600000).toISOString().slice(0, 10);
    const common = (globalHistory?.etf00685l ?? []).filter((c) => c.date < day && idx.has(c.date));
    if (common.length < 20) return null;
    const base = common.at(-20);
    return ((etf.price / base.close - 1) - 2 * (twii.price / idx.get(base.date) - 1)) * 100;
  }

  function holdingsHtml(list, twii) {
    if (!list?.length) return '';
    const decay = leverageDecay(list, twii);
    const badge = decay == null ? ''
      : decay <= -3 ? `<span class="badge warn">正二磨損${fmt(-decay, 1)}%</span>`
      : decay >= 1 ? `<span class="badge buy">複利加速+${fmt(decay, 1)}%</span>` : '';
    const rows = list.map((h) => {
      const dir = h.change > 0 ? 'up' : h.change < 0 ? 'down' : '';
      const sign = h.change > 0 ? '+' : '';
      const digits = h.price >= 1000 ? 0 : 2;
      // 漲跌、漲跌幅只在寬螢幕（PC）顯示
      return `<div class="hold-row"><span class="k">${h.code}</span><b class="${dir}">${fmt(h.price, digits)}</b>`
        + `<span class="ext ${dir}">${sign}${fmt(h.change, digits)}</span><span class="pct ${dir}">${sign}${fmt(h.changePct, 2)}%</span></div>`;
    }).join('');
    return `
      <div class="card">
        <div class="head"><div class="name">我的持股</div>${badge}</div>
        <div class="holds">${rows}</div>
        <div class="meta">${timeState(list[0].time, twii?.state)}</div>
      </div>`;
  }

  // 加權的月線乖離（%）：每晚存的收盤 + 即時指數當最新一天
  function taiexBias(twii) {
    const closes = taiexHistory?.closes;
    if (!twii?.price || !closes?.length) return null;
    const day = new Date(twii.time + 8 * 3600000).toISOString().slice(0, 10);
    const series = [...closes.filter((c) => c.date < day).map((c) => c.close), twii.price].slice(-20);
    if (series.length < 20) return null;
    return (twii.price / (series.reduce((a, b) => a + b, 0) / 20) - 1) * 100;
  }

  // 產業成交比重的 badge，要累積 20 個交易日的收盤比重（sector_history.json，2026/10 起每晚存）才會出現。
  // 金融接棒：金融保險比重達自己 20 日平均的 1.8 倍，且大盤月線乖離 ≥ +5%（過熱時才爆量補漲，常被當成末段訊號）
  // 資金過度集中：半導體比重達自己 20 日平均的 1.3 倍
  // 門檻是暫定值，資料滿一個月後再用實際分布校準
  function sectorBadge(s, twii) {
    if (!s?.shares) return '';
    const day = new Date(s.time + 8 * 3600000).toISOString().slice(0, 10);
    const past = (sectorHistory?.days ?? []).filter((d) => d.date < day).slice(-20);
    if (past.length < 20) return '';
    const avg = (name) => past.reduce((sum, d) => sum + (d.shares[name] ?? 0), 0) / past.length;
    const ratio = (name) => (avg(name) > 0 ? (s.shares[name] ?? 0) / avg(name) : 0);
    if (ratio('金融保險') >= 1.8 && taiexBias(twii) >= 5) return '<span class="badge warn">金融接棒</span>';
    if (ratio('半導體') >= 1.3) return '<span class="badge warn">資金過度集中</span>';
    return '';
  }

  function maHtml(twii) {
    const closes = taiexHistory?.closes;
    if (!twii?.price || !closes?.length) return '';
    const day = new Date(twii.time + 8 * 3600000).toISOString().slice(0, 10);
    const prior = closes.filter((c) => c.date < day).map((c) => c.close);
    if (prior.length < 59) return '';
    const series = [...prior, twii.price];
    const avg = (n) => series.slice(-n).reduce((a, b) => a + b, 0) / n;
    const [ma20, ma60, p] = [avg(20), avg(60), twii.price];
    // 月線乖離到極端時優先警示（近一年約 7% 的日子乖離 ≥ +8%、不到 5% 的日子 ≤ -5%），否則看均線排列
    const bias = ((p - ma20) / ma20) * 100;
    const label = bias >= 8 ? ['乖離過熱', 'warn'] : bias <= -5 ? ['乖離超跌', 'fuel']
      : p > ma20 && ma20 > ma60 ? ['多頭排列', 'up'] : p < ma20 && ma20 < ma60 ? ['空頭排列', 'down'] : ['盤整', ''];
    const row = (name, ma) => {
      const gap = ((p - ma) / ma) * 100;
      return `<div class="ma-row"><span><span class="k">${name}</span> ${fmt(ma, 0)}</span>`
        + `<b class="${gap > 0 ? 'up' : gap < 0 ? 'down' : ''}">${gap > 0 ? '+' : ''}${fmt(gap, 1)}%</b></div>`;
    };
    const closed = twii.state && twii.state !== 'open';
    return `
      <div class="card">
        <div class="head"><div class="name">大盤均線</div><span class="badge ${label[1]}">${label[0]}</span></div>
        ${row('月線', ma20)}${row('季線', ma60)}
        <div class="meta">${timeState(twii.time, closed ? twii.state : null)}</div>
      </div>`;
  }

  // 證交所產業名稱 -> 簡稱（沒列到的照原名）
  const SECTOR_SHORT_NAMES = {
    '電腦及週邊設備': '電腦週邊', '電子零組件': '零組件', '通信網路': '網通', '電子通路': '通路',
    '資訊服務': '資服', '金融保險': '金融', '生技醫療': '生技', '電機機械': '電機', '電器電纜': '電纜',
    '紡織纖維': '紡織', '玻璃陶瓷': '玻陶', '建材營造': '營建', '觀光餐旅': '觀光', '貿易百貨': '百貨',
    '油電燃氣': '油電', '綠能環保': '綠能', '數位雲端': '雲端', '居家生活': '居家',
  };

  // 產業成交比重：全寬卡片，兩欄四行，長條以 100% 為滿格（長度＝實際比重）
  function sectorsHtml(s, twii) {
    if (!s?.top?.length) return '';
    // 盤中（台股交易日 09:00-13:30）資料落後 5 分鐘以上才標「慢X分」，收盤後不標
    const tw = new Date(Date.now() + 8 * 3600000);
    const mins = tw.getUTCHours() * 60 + tw.getUTCMinutes();
    const today = utcDate(tw.getUTCFullYear(), tw.getUTCMonth() + 1, tw.getUTCDate());
    const ageMin = Math.round((Date.now() - s.time) / 60000);
    const lag = isBusinessDay(today) && mins >= 540 && mins <= 810 && ageMin >= 5
      ? ` · <span class="lag">慢${ageMin}分</span>` : '';
    // 收盤後的快照（富果約 13:35）跟其他卡片一樣標成「13:30 · 收盤」；前一交易日的加日期
    const data = new Date(s.time + 8 * 3600000);
    const dataToday = key(utcDate(data.getUTCFullYear(), data.getUTCMonth() + 1, data.getUTCDate())) === key(today);
    const closed = !dataToday || data.getUTCHours() * 60 + data.getUTCMinutes() >= 810;
    const when = closed
      ? (isMarketHoliday('tw') ? '休市' : `${data.getUTCHours() * 60 + data.getUTCMinutes() >= 810 ? '13:30' : hhmm(s.time)} · 收盤`)
      : hhmm(s.time) + lag;
    const cells = s.top.map((r) => `
      <div class="sec">
        <div class="sec-row"><span>${SECTOR_SHORT_NAMES[r.name] ?? r.name}</span><b>${fmt(r.share, 1)}%</b></div>
        <div class="sec-bar"><i style="width:${Math.min(100, r.share)}%"></i></div>
      </div>`).join('');
    return `
      <div class="card wide">
        <div class="head"><div class="head-left"><div class="name">產業成交比重</div>${sectorBadge(s, twii)}</div>
          <div class="meta">電子 ${fmt(s.electronics, 1)}% · ${when}${s.stale ? ' · <span class="lag">舊資料</span>' : ''}</div></div>
        <div class="secs">${cells}</div>
      </div>`;
  }

  // 各卡片所屬市場，用行事曆的休市日判斷「休市」或「收盤」
  const MARKET_OF = { twii: 'tw', txf: 'tw', breadth: 'tw', kospi: 'kr', nikkei: 'jp', sox: 'us', tsm: 'us', nq: 'us', us10y: 'us', brent: 'us' };
  const HOLIDAY_LABEL = { kr: '韓股休市', jp: '日股休市', us: '美股休市' };

  function isMarketHoliday(market) {
    const twToday = new Date(Date.now() + 8 * 3600000).toISOString().slice(0, 10);
    if (market === 'tw') {
      const d = new Date(twToday + 'T00:00:00Z');
      return d.getUTCDay() !== 0 && d.getUTCDay() !== 6 && holidays.has(twToday);
    }
    // 美股用美東當地日期；日、韓跟台灣同一天
    const day = market === 'us' ? new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(new Date()) : twToday;
    return (econEvents[day] ?? []).some((e) => e.label.startsWith(HOLIDAY_LABEL[market]));
  }

  // Worker 只能用交易時段猜：假日時 Yahoo 的時段跳到下一天（判成收盤），開盤初期延遲報價還沒出現（判成休市）。
  // 以行事曆為準：今天是休市日才顯示「休市」；不是的話，開盤後還沒拿到資料是「開盤 · 慢X分」，其餘為「收盤」
  function effectiveState(q) {
    // Yahoo 的 USD/TWD 是國際參考報價，台灣休市日也算開盤；台北匯市沒交易，直接標休市
    if (q.id === 'usdtwd' && isMarketHoliday('tw')) return 'holiday';
    const market = MARKET_OF[q.id];
    if (!market || (q.state !== 'closed' && q.state !== 'holiday')) return q.state;
    if (isMarketHoliday(market)) return 'holiday';
    return q.state === 'holiday' ? 'opening' : 'closed';
  }

  function render(data, margin, profile) {
    announcements = data.announcements ?? null;
    if (data.holidays?.length) {
      holidays = new Map(data.holidays.map((h) => (typeof h === 'string' ? [h, ''] : [h.date, h.name])));
    }
    for (const q of data.quotes) q.state = effectiveState(q);
    const byId = Object.fromEntries(data.quotes.map((q) => [q.id, q]));
    const badges = {
      twii: turnoverBadge(byId.twii, profile),
      txf: basisBadge(byId.txf, byId.twii),
      tsm: adrBadge(byId.tsm),
      us10y: us10yBadge(byId.us10y),
      usdtwd: usdtwdBadge(byId.usdtwd, data.institutional, instHistory),
      sox: monthLineBadge(byId.sox),
      nq: monthLineBadge(byId.nq),
      kospi: monthLineBadge(byId.kospi),
      nikkei: monthLineBadge(byId.nikkei),
    };
    // 插在某張卡片後面的卡片：加權後接我的持股；漲跌家數後接大盤均線；USD/TWD 後接產業成交比重（全寬）；美債後接台指VIX
    const after = {
      twii: holdingsHtml(data.holdings, byId.twii),
      breadth: maHtml(byId.twii),
      usdtwd: sectorsHtml(data.sectors, byId.twii),
      us10y: vixHtml(data.vix, byId.twii),
    };
    const cardFor = (q) => {
      if (q.error) {
        return `<div class="card"><div class="name">${q.name}</div><div class="error">${q.error}</div></div>`;
      }
      if (q.kind === 'daily') return dailyHtml(q, data.institutional);
      if (q.kind === 'breadth') return breadthHtml(q, byId.twii, data.holdings?.find((h) => h.code === '2330'));
      const dir = q.change > 0 ? 'up' : q.change < 0 ? 'down' : '';
      const sign = q.change > 0 ? '+' : '';
      const ageMin = Math.round((Date.now() - q.time) / 60000);
      const sameDay = new Date(q.time).toDateString() === new Date().toDateString();
      // Open: measured lag. Lunch: the feed's typical delay. Closed/holiday: none.
      // 開盤但還沒拿到今天的資料：慢的分鐘數＝開盤到現在
      const openingLag = q.sessionStart ? Math.max(1, Math.round((Date.now() - q.sessionStart) / 60000)) : q.delayMin;
      const lagMin = q.state === 'opening' ? openingLag
        : q.state === 'lunch' ? q.delayMin
        : STATE_LABELS[q.state] ? 0 : ageMin >= 5 && ageMin < 60 ? ageMin : 0;
      const lag = (STATE_LABELS[q.state] ? ` · ${STATE_LABELS[q.state]}` : '')
        + (lagMin ? ` · <span class="lag">慢${lagMin}分</span>` : '');
      const stale = q.stale ? ' · <span class="lag">舊資料</span>' : '';
      const chart = q.candles ? miniCandles(q.candles, q.prev) : '';
      // 沒有報價時間（例如 Yahoo 換到下一個交易時段）就不顯示時間，只留狀態
      // 收盤、休市等狀態只顯示時間，不加日期
      // 開盤但延遲報價還沒出來：最新一筆是昨天的收盤，不顯示時間
      const when = q.time && q.state !== 'opening' && q.state !== 'holiday' ? (sameDay || STATE_LABELS[q.state] ? hhmm(q.time) : mdhm(q.time)) : '';
      const meta = `<div class="meta">${when}${when ? lag : lag.replace(/^ · /, '')}${stale}</div>`;
      const pct = `(${sign}${fmt(q.changePct, 2)}%)`;
      // 有 K 線的卡片（加權）：K 線獨立一整行，最下面一列左邊時間、右邊「15分K」
      const body = chart
        ? `<div class="chg ${dir}">${sign}${fmt(q.change, q.digits)} ${pct}</div>
           <div class="krow">${chart}</div>
           <div class="foot">${meta}<span class="klabel">15分K</span></div>`
        : `<div class="chg ${dir}">${q.unit === 'yield'
            ? `${sign}${fmt(q.change * 100, 1)}bp`
            : `${sign}${fmt(q.change, q.digits)} ${pct}`}</div>
           ${meta}`;
      return `
        <div class="card${chart ? ' has-k' : ''}">
          <div class="head"><div class="name">${q.name}</div>${badges[q.id] ?? ''}</div>
          <div class="price">${fmt(q.price, q.digits)}${q.unit === 'yield' ? '%' : ''}</div>
          ${body}
        </div>`;
    };
    $list.innerHTML = calendarHtml(data.institutional, instHistory)
      + data.quotes.map((q) => cardFor(q) + (after[q.id] ?? '')).join('')
      + (margin ? marginHtml(margin) + marginBalanceHtml(margin) : '');
  }

  async function load() {
    try {
      const getJson = (url) => fetch(url, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
      const marginReq = getJson('margin.json');
      const profileReq = getJson('volume_profile.json');
      const eventsReq = getJson('events.json');
      const historyReq = getJson('institutional.json');
      const taiexReq = getJson('taiex_history.json');
      const vixReq = getJson('vix_history.json');
      const weightReq = getJson('tsmc_weight.json');
      const globalReq = getJson('global_history.json');
      const sectorReq = getJson('sector_history.json');
      const govReq = getJson('gov_banks.json');
      const res = await fetch(API, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const events = await eventsReq;
      if (events) {
        econEvents = {};
        for (const e of events) (econEvents[e.date] ??= []).push(e);
      }
      instHistory = (await historyReq) ?? instHistory;
      taiexHistory = (await taiexReq) ?? taiexHistory;
      vixHistory = (await vixReq) ?? vixHistory;
      tsmcWeight = (await weightReq) ?? tsmcWeight;
      globalHistory = (await globalReq) ?? globalHistory;
      sectorHistory = (await sectorReq) ?? sectorHistory;
      govBanks = (await govReq) ?? govBanks;
      volumeProfile = (await profileReq) ?? volumeProfile;
      render(data, pickMargin(data.margin, await marginReq), await profileReq);
      $status.className = '';
      $status.textContent = `更新 ${hhmm(data.updated)} (GMT+8)`;
    } catch (err) {
      $status.className = 'err';
      $status.textContent = `更新失敗：${err.message}`;
    }
  }

  function start() {
    stop();
    load();
    timer = setInterval(load, POLL_MS);
  }

  function stop() {
    if (timer) clearInterval(timer);
    timer = null;
  }

  // 手機切到背景就停止輪詢，回來時立刻更新
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
  $list.innerHTML = calendarHtml();
  start();
</script>
</body>
</html>
