<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>行情看板</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --card: #191c22;
    --text: #eef0f3;
    --muted: #8b93a1;
    --line: #2a2f38;
    --up: #ff5c5c;
    --down: #2fc27f;
    --warn: #e0a84a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
    padding: max(12px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    max-width: 560px;
    margin: 0 auto 12px;
  }
  h1 { font-size: 20px; margin: 0; }
  #status { color: var(--muted); font-size: 12px; text-align: right; }
  #status.err { color: var(--warn); }
  main { display: grid; gap: 10px; max-width: 560px; margin: 0 auto; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 12px;
  }
  .name { font-weight: 600; }
  .sym { color: var(--muted); font-size: 12px; }
  .price { font-size: 24px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .chg { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .meta { grid-column: 1 / -1; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
  .lag { color: var(--warn); }
  .error { grid-column: 1 / -1; color: var(--warn); font-size: 13px; }
  button {
    display: block;
    margin: 16px auto 0;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 20px;
    font: inherit;
  }
</style>
</head>
<body>
<header>
  <h1>行情看板</h1>
  <div id="status">載入中…</div>
</header>
<main id="list"></main>
<button id="refresh" type="button">立即更新</button>

<script>
  // 部署 Worker 後改成你的網址，例如 https://stockinfo-quotes.xxx.workers.dev
  const API = 'https://stockinfo-quotes.YOUR-SUBDOMAIN.workers.dev/quotes';
  const POLL_MS = 120 * 1000;

  const $list = document.getElementById('list');
  const $status = document.getElementById('status');
  let timer = null;

  const fmt = (n, d) => n == null ? '—' : n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const hhmm = (t) => new Date(t).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Taipei' });
  const mdhm = (t) => new Date(t).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Taipei' });

  function render(data) {
    $list.innerHTML = data.quotes.map((q) => {
      if (q.error) {
        return `<div class="card"><div class="name">${q.name}</div><div class="error">${q.error}</div></div>`;
      }
      const dir = q.change > 0 ? 'up' : q.change < 0 ? 'down' : '';
      const sign = q.change > 0 ? '+' : '';
      const ageMin = Math.round((Date.now() - q.time) / 60000);
      const sameDay = new Date(q.time).toDateString() === new Date().toDateString();
      const lag = ageMin >= 5 && ageMin < 60 ? `<span class="lag">延遲約 ${ageMin} 分</span>` : '';
      return `
        <div class="card">
          <div>
            <div class="name">${q.name}</div>
            <div class="sym">${q.symbol} · ${q.source}${q.stale ? ' · 舊資料' : ''}</div>
          </div>
          <div>
            <div class="price">${fmt(q.price, q.digits)}</div>
            <div class="chg ${dir}">${sign}${fmt(q.change, q.digits)} (${sign}${fmt(q.changePct, 2)}%)</div>
          </div>
          <div class="meta"><span>報價 ${sameDay ? hhmm(q.time) : mdhm(q.time)}</span>${lag}</div>
        </div>`;
    }).join('');
  }

  async function load() {
    try {
      const res = await fetch(API, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      render(data);
      $status.className = '';
      $status.textContent = `更新 ${hhmm(data.updated)} · 每 2 分鐘`;
    } catch (err) {
      $status.className = 'err';
      $status.textContent = `更新失敗：${err.message}`;
    }
  }

  function start() {
    stop();
    load();
    timer = setInterval(load, POLL_MS);
  }

  function stop() {
    if (timer) clearInterval(timer);
    timer = null;
  }

  // 手機切到背景就停止輪詢，回來時立刻更新
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
  document.getElementById('refresh').addEventListener('click', load);
  start();
</script>
</body>
</html>
