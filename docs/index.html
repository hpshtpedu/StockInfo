<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>行情看板</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --card: #191c22;
    --text: #eef0f3;
    --muted: #8b93a1;
    --line: #2a2f38;
    --up: #ff5c5c;
    --down: #2fc27f;
    --warn: #e0a84a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
    padding: max(12px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    max-width: 560px;
    margin: 0 auto 12px;
  }
  h1 { font-size: 20px; margin: 0; white-space: nowrap; }
  #source { color: var(--muted); font-size: 11px; font-weight: 400; margin-left: 6px; }
  .right { color: var(--muted); font-size: 11px; line-height: 1.35; text-align: right; white-space: nowrap; }
  #status.err { color: var(--warn); }
  main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; max-width: 560px; margin: 0 auto; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .price { font-size: clamp(18px, 5.6vw, 26px); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chg { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .meta { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lag { color: var(--warn); }
  .error { color: var(--warn); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>行情看板<span id="source">來源：Yahoo Finance</span></h1>
  <div class="right">
    <div id="status">載入中…</div>
    <div>每2分鐘更新</div>
  </div>
</header>
<main id="list"></main>
<script>
  const API = 'https://stockinfo-quotes.hpshtpedu.workers.dev/quotes';
  const POLL_MS = 120 * 1000;
  const STATE_LABELS = { lunch: '午休', closed: '收盤', holiday: '休市' };

  const $list = document.getElementById('list');
  const $status = document.getElementById('status');
  let timer = null;

  const fmt = (n, d) => n == null ? '—' : n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const hhmm = (t) => new Date(t).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Taipei' });
  const mdhm = (t) => new Date(t).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Taipei' });

  function render(data) {
    $list.innerHTML = data.quotes.map((q) => {
      if (q.error) {
        return `<div class="card"><div class="name">${q.name}</div><div class="error">${q.error}</div></div>`;
      }
      const dir = q.change > 0 ? 'up' : q.change < 0 ? 'down' : '';
      const sign = q.change > 0 ? '+' : '';
      const ageMin = Math.round((Date.now() - q.time) / 60000);
      const sameDay = new Date(q.time).toDateString() === new Date().toDateString();
      const lag = STATE_LABELS[q.state] ? ` · ${STATE_LABELS[q.state]}`
        : ageMin >= 5 && ageMin < 60 ? ` · <span class="lag">慢${ageMin}分</span>` : '';
      const stale = q.stale ? ' · <span class="lag">舊資料</span>' : '';
      return `
        <div class="card">
          <div class="name">${q.name}</div>
          <div class="price">${fmt(q.price, q.digits)}${q.unit === 'yield' ? '%' : ''}</div>
          <div class="chg ${dir}">${q.unit === 'yield'
            ? `${sign}${fmt(q.change * 100, 1)}bp`
            : `${sign}${fmt(q.change, q.digits)} (${sign}${fmt(q.changePct, 2)}%)`}</div>
          <div class="meta">${sameDay ? hhmm(q.time) : mdhm(q.time)}${lag}${stale}</div>
        </div>`;
    }).join('');
  }

  async function load() {
    try {
      const res = await fetch(API, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      render(data);
      $status.className = '';
      $status.textContent = `更新 ${hhmm(data.updated)}`;
    } catch (err) {
      $status.className = 'err';
      $status.textContent = `更新失敗：${err.message}`;
    }
  }

  function start() {
    stop();
    load();
    timer = setInterval(load, POLL_MS);
  }

  function stop() {
    if (timer) clearInterval(timer);
    timer = null;
  }

  // 手機切到背景就停止輪詢，回來時立刻更新
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());  start();
</script>
</body>
</html>
