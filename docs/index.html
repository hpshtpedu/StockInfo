<!doctype html>
<html lang="zh-Hant">

<title>股市大局觀</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --card: #191c22;
    --text: #eef0f3;
    --muted: #8b93a1;
    --line: #2a2f38;
    --up: #ff5c5c;
    --down: #2fc27f;
    --warn: #e0a84a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
    padding: max(12px, env(safe-area-inset-top)) 12px max(24px, env(safe-area-inset-bottom));
  }
  header {
    display: flex;
    align-items: center;  /* 標題和右邊的更新時間垂直置中 */
    justify-content: space-between;
    gap: 8px;
    max-width: 560px;
    margin: 0 auto 12px;
  }
  /* 標題用微軟正黑體（iPhone 沒有這個字型，會改用系統的蘋方） */
  h1 { font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif; font-size: 24px; font-weight: 700; margin: 0; white-space: nowrap; line-height: 1.2; }
  /* 資料來源：頁尾一整行，置中 */
  #source { max-width: 560px; margin: 14px auto 4px; color: var(--muted); font-size: 11px; text-align: center; }
  .right { color: var(--muted); font-size: 11px; line-height: 1.35; text-align: right; white-space: nowrap; }
  #status.err { color: var(--warn); }
  main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; max-width: 560px; margin: 0 auto; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 7px 6px 5px;  /* 底部少一點：最下面一行的字本身已帶行高留白 */
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
    overflow: hidden;
  }
  /* 行情卡片的框：內容出錯也只會被裁掉，不會把卡片撐大 */
  .card:not(.cal) { max-height: 160px; }
  /* 全寬卡片（三大法人） */
  .card.wide { grid-column: 1 / -1; max-height: 170px; gap: 4px; }
  /* 分類標題：橫跨兩欄 */
  /* 分類標題：扁平的深藍色條（紅綠橘已用於漲跌和警示，藍色不會被誤讀成訊號） */
  /* 左邊亮藍色在前 48px 內漸層融入較淺的深藍，後面整條同色 */
  .section { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; grid-column: 1 / -1; margin-top: 6px; padding: 5px 12px; border-radius: 8px; background: linear-gradient(90deg, #5b8fd6 0, #2b4166 48px, #2b4166 100%);
    color: #d6e4ff; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
  .section .sec-tg { color: #9fb4d6; font-size: 14px; letter-spacing: 0; }
  .sec-hidden { display: none !important; }
  /* 盤後還沒開獎的卡片：黑色亮漆（上半部高光＋水平反光線、很淡的斜向微光、上亮下暗的邊），字還看得到 */
  .card.pend { position: relative; }
  .card.pend::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background:
      linear-gradient(112deg, rgba(255,255,255,0) 10%, rgba(255,255,255,.045) 24%, rgba(255,255,255,0) 40%),
      linear-gradient(180deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.06) 44%, rgba(255,255,255,0) 44.6%),
      linear-gradient(180deg, rgba(2,3,6,.50) 0%, rgba(2,3,6,.66) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(0,0,0,.7), inset 0 0 18px rgba(0,0,0,.5); }
  /* 最後一行（時間）貼齊卡片底部，同一排的時間才會對齊 */
  .card:not(.cal) > :last-child { margin-top: auto; }
  /* 加權卡片（有 K 線）：漲跌幅要緊接在漲跌下面，不把最後一列推到底 */
  .kw, .kw-foot { cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  .kw[data-p="0"] .k1, .kw[data-p="1"] .k0, .kw-foot[data-p="0"] .k1, .kw-foot[data-p="1"] .k0 { display: none; }
  /* 加權的 15 分 K：整行寬，上下跟文字隔開；「15分K」放在時間那一行的最右邊 */
  .krow { margin: 8px 0 4px; }
  /* 加權、費半：漲跌和 K 線之間一條淡分隔線 */
  .card.has-k > .kw { margin-top: 4px; border-top: 1px solid var(--line); }
  .card.has-k:not(.twii) > .krow { margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--line); }
  .card.has-k .foot { align-items: center; }
  .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .price { font-size: clamp(17px, 5.2vw, 24px); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* 名稱優先完整顯示，空間不夠時截斷 badge */
  /* 標題的「局」：設定頁入口，外觀跟其他字完全一樣（不變色、不變游標、不閃） */
  .ju { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: text;
    -webkit-tap-highlight-color: transparent; -webkit-appearance: none; appearance: none; }
  .ju:focus:not(:focus-visible) { outline: none; }
  /* 自選股標題列：badge 都靠最右（尾盤拉雞／殺雞在左、增減在右），跟左邊的「自選股」對稱：
     「自」字形左邊自帶約 1.5px 留白，右邊內縮 2px（實測），兩邊離卡片邊框一樣遠 */
  .hhead .badges { gap: 6px; padding-right: 2px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 2px; min-width: 0; }
  .head .name { flex-shrink: 0; }
  .badge.warn { background: var(--warn); color: var(--bg); }
  .badge.fuel, .badge.sell { background: var(--down); color: var(--bg); }
  .badge.buy { background: var(--up); color: var(--bg); }
  /* 台指期下半部：淡分隔線（跟加權的同高）下面，預設外資空單成本，點一下換 60 分K，K 線填滿成本那兩行的高度 */
  .tw2 { margin-top: 4px; border-top: 1px solid var(--line); }
  .tw2.sw { cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  /* 兩頁疊在同一格、只切換看不看得到：高度固定是兩頁中較高的，點一下卡片（和同排的加權）不會跳 */
  .tw2.sw { display: grid; }
  .tw2.sw > * { grid-area: 1 / 1; }
  .tw2[data-p="0"] .k1, .tw2[data-p="1"] .k0 { visibility: hidden; }
  .tw2-foot[data-p="0"] .k1, .tw2-foot[data-p="1"] .k0 { visibility: hidden; }
  .tw2.sw .krow { margin: 6px 0 0; }
  .card.txf .tw2.sw .kchart { height: 36px; }
  /* 加權多一行月/季線：同一排的台指期一起放寬，兩張卡底部才對齊 */
  .card.twii, .card.txf { max-height: 190px; }
  /* 新聞快訊：一次一則，其他頁隱藏 */
  .pager { cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  .pager .jp, .pager .pg { display: none; }
  .pager[data-p="0"] [data-i="0"], .pager[data-p="1"] [data-i="1"], .pager[data-p="2"] [data-i="2"], .pager[data-p="3"] [data-i="3"], .pager[data-p="4"] [data-i="4"] { display: block; }
  .pager .pg { margin-left: auto; color: var(--muted); font-size: 13.2px; }
  /* 卡片高度固定 2 行（以最長的標題為準），換頁不跳動；塞不下就在第 2 行尾加「…」。時間放在卡片名稱右邊 */
  .jin10 .jt { font-size: clamp(16.5px, 5vw, 19.8px); font-weight: 600; line-height: 1.35; height: 2.7em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .jin10 .head { justify-content: flex-start; align-items: baseline; }
  /* 卡片名稱跟標題一樣大，用橘色（娛樂卡片的識別色） */
  .jin10 .head .name { font-size: clamp(16.5px, 5vw, 19.8px); color: var(--warn); }
  .jin10 .jtime .readmark { width: 0.95em; height: 0.95em; margin-left: 4px; vertical-align: -0.1em; color: #479ef5; }
  .jin10 .head .jtime { color: var(--muted); font-size: clamp(12.5px, 3.6vw, 14.3px); margin-left: 6px; display: none; }
  .jin10[data-p="0"] .jtime[data-i="0"], .jin10[data-p="1"] .jtime[data-i="1"], .jin10[data-p="2"] .jtime[data-i="2"], .jin10[data-p="3"] .jtime[data-i="3"], .jin10[data-p="4"] .jtime[data-i="4"] { display: inline; }
  /* 我的持股：全寬卡片，左欄 2330、00685L，右欄 0056、00878；每檔一個淡底小方塊當視覺錨點。
     第一行：股號（橘）＋漲跌（▲▼，靠右且切齊）；第二行：價格＋（漲跌幅），跟其他卡片的寫法一致 */
  /* 選擇器多一層，才蓋得過 PC 版 media query 裡的 .card:not(.cal) 高度上限 */
  .card.wide.holdings { max-height: 280px; }
  .holds { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 5px 6px; }
  .hold { display: flex; flex-direction: column; gap: 1px; background: #20242c; border: 1px solid var(--line); border-radius: 8px;
    padding: 3px 7px 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hold .top, .hold .q { display: flex; align-items: baseline; gap: 6px; }
  .hold .k { color: var(--text); font-weight: 700; font-size: calc(clamp(15px, 4.8vw, 19px) - 1px); line-height: 1.15; }
  /* 漲跌靠方塊右邊，但固定寬度、內容靠左，四檔的 ▲▼ 落在同一個水平位置 */
  /* 漲跌：細框小 badge（固定寬度、內容靠左，▲▼ 位置對齊），紅漲綠跌、平盤白 */
  /* 整個 badge（含外框）跟股號一樣高（股號字級 × 行高 1.15）：iPhone 的 ▼ 用備援字型、行高較大，
     不固定會把第一行撐高，下一行的價格被往下擠 */
  .hold .c { margin-left: auto; min-width: 4.3em; text-align: left; font-size: calc(clamp(12.5px, 4vw, 16px) - 1px); font-weight: 600; line-height: 1;
    height: calc((clamp(15px, 4.8vw, 19px) - 1px) * 1.15); align-self: center; display: inline-flex; align-items: center;
    padding: 0 6px; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 45%, transparent);
    background: color-mix(in srgb, currentColor 10%, transparent); }
  /* 價格同加權的大數字、漲跌幅同加權的漲跌。價格往下移，底部跟（漲跌幅）括號的底部切齊 */
  .hold .q b { font-size: clamp(17px, 5.2vw, 24px); line-height: 1.15; position: relative; top: 0.095em; }
  /* 外資／投信買賣超（張），盤後才出現 */
  /* 兩欄固定位置（像 tab），「投」永遠從同一個位置開始；標籤白色正常粗細（同三大法人明細），未公布用灰字 */
  .hold .fl { display: grid; grid-template-columns: 1fr 1fr; column-gap: 6px; margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--line); font-size: clamp(12px, 3.6vw, 14px); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hold .fl .fk { color: var(--text); font-weight: 400; margin-right: 4px; }
  .hold .fl .fp { color: var(--muted); font-weight: 400; }
  /* 下半部（K 線／外投／月季線／殖利率／複利）固定同一個高度＝最高的 K 線那一頁，切換時方塊不忽大忽小 */
  .hold .fl { height: 25px; align-items: center; }
  .tsw { cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  /* 下半部分頁：每頁包一層 .pg（data-i），只顯示目前那頁 */
  .tsw > .pg { display: none; }
  .tsw[data-p="0"] > .pg[data-i="0"], .tsw[data-p="1"] > .pg[data-i="1"], .tsw[data-p="2"] > .pg[data-i="2"],
  .tsw[data-p="3"] > .pg[data-i="3"], .tsw[data-p="4"] > .pg[data-i="4"] { display: block; }  /* 2330 有 4 頁（外資、投信、公股、月季），多留一頁 */
  .hold .fl.ma { font-weight: 400; }
  .hold .fl.ma b { color: var(--warn); font-weight: 700; }
  .hold .fl .wide { grid-column: 1 / -1; }
  .hold .fl.ma b.up { color: var(--up); } .hold .fl.ma b.down { color: var(--down); }
  .hold .fl.cmp2 b.down { color: var(--down); }
  .hold .fl.cmp2 b.up { color: var(--up); }
  .hold .fl.ma b.fp { color: var(--muted); font-weight: 400; }
  /* 盤中的 15 分 K：占外/投那一行的位置，高度相同 */
  .hold .fl.hk { display: block; }
  .hold .fl.hk .kchart { height: 19px; }
  .hold .q .p { font-size: calc(clamp(14px, 4.6vw, 18px) - 2px); font-weight: 600; }
  /* 量能：避開漲跌用的紅綠，冷暖色階 量縮藍 → 正常灰 → 放量黃 → 爆量橘 */
  .badge.vol-low { background: #5b8fd6; color: var(--bg); }
  .badge.vol-high { background: #d9c44a; color: var(--bg); }
  .badge.vol-hot { background: var(--warn); color: var(--bg); }
  /* 最下面一行：左邊報價時間，右邊「15分K」標示 */
  .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 2px; min-width: 0; }
  .foot-left { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  /* 卡片右下角的 badge（例如融資維持率 ≤140% 的「斷頭」） */
  .foot .badge.warn { flex-shrink: 0; }
  .badge.note { color: var(--muted); }
  .foot .badge.note { flex-shrink: 0; }
  .klabel { flex-shrink: 0; color: var(--muted); font-size: 11px; }
  .kchart { width: 100%; height: 30px; display: block; }
  .badge { min-width: 0; font-size: clamp(11px, 3.9vw, 15.5px); font-weight: 600; line-height: 1.5; padding: 0 5px; letter-spacing: -0.2px; border-radius: 999px; background: #363c48; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .chg { font-size: clamp(11.5px, 3.4vw, 13px); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 拿掉明細行的卡片（台指VIX、外資淨OI、散戶多空比、融資維持率）：主數字放大，空間往上推 */
  .card.roomy { justify-content: space-between; }
  /* 台股盤後跟國際市場同一套字級：大數字同 .price，漲跌／較前日同國際市場的漲跌 */
  .card.roomy .chg, .card.roomy .cmp { font-size: clamp(14px, 4.6vw, 18px); }
  /* 加權、台指期同一排：漲跌一起放大，兩張字級一致；時間貼底對齊 */
  .card.txf .chg, .card.has-k .chg, .card.intl .chg { font-size: clamp(14px, 4.6vw, 18px); }  /* 國際市場的漲跌跟加權一樣大 */
  .card.txf .meta { margin-top: auto; }
  /* 外資成本（估）：上一行小字標籤、下一行數字，半寬卡片才放得下 */
  .card.txf .txcost { margin-top: 4px; color: var(--muted); font-size: clamp(11.5px, 3.3vw, 13px); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.txf .txcost b { display: block; color: inherit; font-size: clamp(17px, 5.2vw, 22px); font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .price small { font-size: 13px; font-weight: 600; }
  .seg + .seg { margin-left: 10px; }
  /* 漲跌家數：一行的扁卡片（名稱、▲上漲 ▼下跌、最右邊壓雞盤／拉雞盤） */
  .brd-dn { margin-left: 10px; }
  .card.flat { gap: 0; }
  .card.flat .head { justify-content: flex-start; gap: 12px; }
  .card.flat .bcnt { font-size: clamp(15px, 4.6vw, 18px); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* 右邊緣跟下面自選股標題列的增減 badge 切齊（都貼齊卡片右邊） */
  .card.flat .head .badge { margin-left: auto; }
  /* 損益分段膠囊：一個圓角灰底，左段總損益、右段今日增減（字一樣大、紅綠字），中間細深色線 */
  .pnl { display: inline-flex; align-items: stretch; border-radius: 999px; overflow: hidden; flex-shrink: 0; }
  .pnl .badge { border-radius: 0; display: inline-flex; align-items: center; }
  .pnl .badge + .badge { border-left: 1px solid var(--bg); padding: 0 6px 0 5px; }
  /* 台股競猜：一行的扁卡片。按鈕紅漲綠跌；選了的實心，沒選的外框 */
  .card.guess .gs { display: flex; align-items: center; gap: 8px; margin-left: auto; white-space: nowrap; font-size: clamp(13px, 4vw, 15px); font-variant-numeric: tabular-nums; }
  .card.guess .gb { font: inherit; font-weight: 700; padding: 2px 12px; border-radius: 999px; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .card.guess .gb.up { color: var(--up); border: 1px solid var(--up); } .card.guess .gb.down { color: var(--down); border: 1px solid var(--down); }
  .card.guess .gb.up.on { background: var(--up); color: #fff; } .card.guess .gb.down.on { background: var(--down); color: #fff; }
  .card.guess .gt { color: var(--muted); }
  .card.guess .win { color: var(--warn); font-weight: 700; }
  .card.guess .rate { color: var(--muted); }
  .card.flat .bcnt.pend-txt { color: var(--muted); font-weight: 400; font-size: clamp(13px, 4vw, 15px); }
  .seg .k { color: var(--muted); font-weight: 400; margin-right: 2px; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .meta { color: var(--muted); font-size: clamp(11.5px, 3.3vw, 13px); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lag { color: var(--warn); }
  .txt { color: var(--text); }
  .cmp { font-size: clamp(12px, 3.5vw, 13.5px); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .cmp .txt, .chg .txt { font-weight: 400; }
  .cmp .txt { color: var(--muted); }  /* 盤後卡片第二行的標籤（較前日、餘額）跟八大的「M/D起」一樣：灰字細體、數字半粗 */
  /* 全寬卡片（三大法人）的明細行有整行寬度，字可以大一點；八大的連買/賣下面沒別的內容，也放大 */
  /* 三大法人：明細行跟最下面一列（日期、法人成交比重）之間留空，不擠 */
  .head .badges { display: flex; gap: 4px; min-width: 0; }
  .inst-foot { padding-top: 8px; }  /* 用 padding：margin-top 會被「最後一列貼底」的 margin-top: auto 蓋掉 */
  .card.wide .chg { font-size: clamp(13px, 4.6vw, 18px); }
  .chg.big { font-size: clamp(14px, 4.4vw, 17px); }
  .error { color: var(--warn); font-size: 12px; }
  .cal { grid-column: 1 / -1; font-size: 14.3px; gap: 3px; }
  /* 懸掛縮排：圖示獨立一欄，換行文字對齊「今」；明日行用隱形圖示佔位，跟「今」對齊 */
  .cal .today, .cal .next { display: flex; gap: 4px; }
  .cal .ico { flex-shrink: 0; font-size: 14.3px; }
  .cal .next .ico { visibility: hidden; }
  .cal .today { font-weight: 600; }
  .cal .today b { color: var(--warn); }
  .cal .next { color: var(--muted); font-size: 13.2px; }
  .cal .next b { color: inherit; font-weight: 400; }
  .cal .ev { color: var(--text); font-weight: 600; }
  .cal .next .ev { color: inherit; font-weight: 400; }
  /* 放在最後，才能覆蓋上面的基本尺寸 */
  /* PC／平板橫放（寬度 ≥ 600px）：持股多顯示漲跌和漲跌幅、K 線放大，卡片才不會太空 */
  @media (min-width: 600px) {
    /* 加權的 15 分 K 在 PC 上放大，卡片高度上限跟著放寬 */
    .kchart { height: 40px; }
    .card:not(.cal) { max-height: 176px; }
    .card.twii, .card.txf { max-height: 206px; }
  }
  /* 窄螢幕（例如 iPhone 開「顯示器放大」約 320px）：邊距收窄、持股字小一號，漲跌幅才放得下 */
  @media (max-width: 359px) {
    body { padding-left: 8px; padding-right: 8px; }
    main { gap: 4px; }
    .card { padding-left: 5px; padding-right: 5px; }
    .hold { padding-left: 5px; padding-right: 5px; }
    .badge { padding: 0 3px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>股市大<button type="button" class="ju" id="ju" aria-label="設定">局</button>觀</h1>
  </div>
  <div class="right">
    <div id="status">載入中…</div>
    <div>每2分鐘更新</div>
  </div>
</header>
<main id="list"></main>
<footer id="source">資料來源：Yahoo、證交所、期交所、HiStock、金十數據</footer>
<script src="private-vault.js?v=6"></script>
<script>
  const API = 'https://stockinfo-quotes.hpshtpedu.workers.dev/quotes';
  const POLL_MS = 120 * 1000;
  const STATE_LABELS = { lunch: '午休', closed: '收盤', holiday: '休市', night: '夜盤', opening: '開盤', auction: '試撮', fault: '<span class="lag">故障</span>' };
  // 「時間 · 狀態」；休市只寫「休市」（時間是上一個交易日的，沒意義）
  const twDate = (t) => new Date(t + 8 * 3600000).toISOString().slice(0, 10);
  const timeState = (time, state) => (state === 'holiday' ? '休市'
    : state === 'auction' && twDate(time) !== twDate(Date.now()) ? '試撮'  // 早盤試撮：時間是昨天的，不顯示
    : `${hhmm(time)}${STATE_LABELS[state] ? ` · ${STATE_LABELS[state]}` : ''}`);

  const $list = document.getElementById('list');
  const $status = document.getElementById('status');
  let timer = null;

  const fmt = (n, d) => n == null ? '—' : n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const hhmm = (t) => new Date(t).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Taipei' });
  const mdhm = (t) => new Date(t).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Taipei' });

  // ---- 結算行事曆：依規則推算，未扣除國定假日順延 ----
  const WEEKDAYS = '日一二三四五六';
  const QUARTER = [3, 6, 9, 12];

  // 該月第 n 個星期 dow 是幾號
  function nthWeekday(y, m, dow, n) {
    const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
    return 1 + ((dow - first + 7) % 7) + (n - 1) * 7;
  }

  // 台股休市日（證交所公告，由 Worker 提供）：日期 -> 節日名稱
  let holidays = new Map();

  // 日期一律用 UTC 午夜的 Date 表示台北日曆日
  const utcDate = (y, m, d) => new Date(Date.UTC(y, m - 1, d));
  const addDays = (t, n) => new Date(t.getTime() + n * 86400000);
  const key = (t) => t.toISOString().slice(0, 10);
  const isBusinessDay = (t) => t.getUTCDay() !== 0 && t.getUTCDay() !== 6 && !holidays.has(key(t));

  // 期交所：最後交易日遇假日，順延至次一營業日
  function nextBusinessDay(t) {
    while (!isBusinessDay(t)) t = addDays(t, 1);
    return t;
  }

  // 該月倒數第 2 個台股營業日（MSCI/FTSE 遇台灣假日會再往前找）
  function secondLastBusinessDay(y, m) {
    let t = utcDate(y, m + 1, 0);
    for (let count = 0; ; t = addDays(t, -1)) {
      if (isBusinessDay(t) && ++count === 2) return t;
    }
  }

  // 原定到期日 t 的台指結算項目（尚未順延）
  function taifexExpiries(t) {
    const [y, m, d] = [t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()];
    return d === nthWeekday(y, m, 3, 3) ? ['台指期貨＋選擇權月結算'] : [];
  }

  // 台灣與美國的結算
  function settlements(today) {
    const [y, m, d] = [today.getUTCFullYear(), today.getUTCMonth() + 1, today.getUTCDate()];
    const out = [];
    // 回頭看兩週內的原定到期日，順延後落在今天的都算
    for (let back = 0; back <= 14; back++) {
      const base = addDays(today, -back);
      const labels = taifexExpiries(base);
      if (labels.length && key(nextBusinessDay(base)) === key(today)) {
        out.push(...labels.map((l) => (back ? `${l}（假日順延）` : l)));
      }
    }
    // HKEX MSCI 台指 (摩台/MDFK) 與 SGX FTSE 台指 (富台) 同為倒數第 2 個營業日
    if (key(secondLastBusinessDay(y, m)) === key(today)) out.push('MSCI/富時台股期貨結算');
    // 美股只列季結算的四巫日；一般月份的選擇權月結算不顯示
    if (QUARTER.includes(m) && d === nthWeekday(y, m, 5, 3)) out.push('美股四巫日（季結算）');
    // 指數季度調整生效日（被動基金在當天收盤集中調整，尾盤常爆量）：
    // 富時＝3/6/9/12 月第三個星期五收盤（遇台股休市提前到前一個營業日）；
    // MSCI＝2/5/8/11 月最後一個營業日收盤（一般規則，偶爾為避開美國假期提前，所以標「預計」）
    if (QUARTER.includes(m)) {
      let f = utcDate(y, m, nthWeekday(y, m, 5, 3));
      while (!isBusinessDay(f)) f = addDays(f, -1);
      if (key(f) === key(today)) out.push('富時季度調整生效（收盤）');
    }
    if ([2, 5, 8, 11].includes(m)) {
      let t = utcDate(y, m + 1, 0);
      while (!isBusinessDay(t)) t = addDays(t, -1);
      if (key(t) === key(today)) out.push('MSCI季度調整生效（預計，收盤）');
    }
    return [...new Set(out)];
  }

  // 經濟數據、財報等事件（台灣時間），由 scripts/build_events.py 產生 events.json
  let econEvents = {};

  // 證交所的正式節日名稱 -> 一般說法（「補假」後綴會保留）
  const HOLIDAY_SHORT_NAMES = {
    '中華民國開國紀念日': '元旦',
    '農曆除夕及春節': '春節',
    '和平紀念日': '228',
    '兒童節及民族掃墓節': '清明連假',
    '孔子誕辰紀念日/教師節': '教師節',
    '臺灣光復暨金門古寧頭大捷紀念日': '光復節',
  };

  // 平日休市才標示，例如「國慶日補假休市」
  function holidayLabel(t) {
    if (t.getUTCDay() === 0 || t.getUTCDay() === 6 || !holidays.has(key(t))) return '';
    let name = holidays.get(key(t)) || '台股';
    for (const [full, short] of Object.entries(HOLIDAY_SHORT_NAMES)) name = name.replace(full, short);
    return `${name}休市`;
  }

  // 美國的事件（events.json 的來源）—— 對台灣多在半夜，同一天排在最前面
  const US_SOURCES = new Set(['fred', 'fomc', 'ism', 'nvidia']);

  // 每項：{ text, settle: 結算類（橘色）, us: 美國事件 }；美國的排前面，其餘維持原順序
  // Worker 當天抓到的公告：{ date, revenue: { month, yoy, mom }, dividends: [文字] }
  let announcements = null;

  // 台積電月營收：每月 10 日公布上月營收，遇假日提前到前一個營業日
  function tsmcRevenueLabel(t) {
    let day = utcDate(t.getUTCFullYear(), t.getUTCMonth() + 1, 10);
    while (!isBusinessDay(day)) day = addDays(day, -1);
    if (key(day) !== key(t)) return '';
    const month = t.getUTCMonth() === 0 ? 12 : t.getUTCMonth();  // the previous month
    return `台積電${month}月營收`;
  }

  // 配息發放日：登入（私人頁解鎖）後，依張數算出能領多少（現金股利 × 股數）。
  // 台積電單筆 2 萬以上扣二代健保補充保費 2.11%；00878 扣匯費 10 元；其他不扣（照使用者的實際入帳情況）
  const DIVIDEND_CODES = { 台積電: '2330', '0056': '0056', '00878': '00878' };
  function dividendSuffix(e) {
    const m = e.src === 'tw_stocks' && e.label.match(/^(.+?)配息([\d.]+)元$/);
    const code = m && DIVIDEND_CODES[m[1]];
    const lots = code && privateLots?.[code];
    if (!(lots > 0)) return '';
    const gross = Number(m[2]) * lots * 1000;
    const net = Math.round(gross - (code === '2330' && gross >= 20000 ? gross * 0.0211 : 0) - (code === '00878' ? 10 : 0));
    return `，可領 ${fmt(net, 0)}元`;
  }

  function dayEvents(t) {
    const holiday = holidayLabel(t);
    const items = [
      ...(holiday ? [holiday] : []),
      ...settlements(t),
    ].map((text) => ({ text, settle: true, us: text.startsWith('美股') }));
    for (const e of econEvents[key(t)] ?? []) {
      // 台灣國定假日：台股已標休市的日子就不重複（例如國慶日補假），週末或照常開市的日子才列出
      if (e.src === 'tw_holidays' && holiday) continue;
      items.push({ text: e.label + dividendSuffix(e), settle: false, us: US_SOURCES.has(e.src) || e.label.startsWith('美股') });
    }
    // 當天抓到的公告（Worker 提供）：營收換成帶年增/月增的版本，另外加上配息公告
    const ann = announcements?.date === key(t) ? announcements : null;
    const revenue = tsmcRevenueLabel(t);
    if (revenue) {
      const r = ann?.revenue;
      const pct = (v) => `<span class="${v > 0 ? 'up' : v < 0 ? 'down' : ''}">${v > 0 ? '+' : ''}${fmt(v, 2)}%</span>`;
      items.push({ text: r ? `台積電${r.month}月營收(YoY ${pct(r.yoy)}, MoM ${pct(r.mom)})` : revenue, settle: false, us: false });
    }
    for (const text of ann?.dividends ?? []) items.push({ text, settle: false, us: false });
    items.sort((a, b) => b.us - a.us);
    return { items, any: items.length > 0 };
  }

  function dayLine(label, t, ev) {
    const parts = ev.items.map((i) => (i.settle ? `<b>${i.text}</b>` : `<span class="ev">${i.text}</span>`)).join('、');
    return `${label} ${t.getUTCMonth() + 1}/${t.getUTCDate()}(${WEEKDAYS[t.getUTCDay()]})${parts ? `　${parts}` : ''}`;
  }

  let instHistory = null;

  // 外資連買/連賣天數：GitHub Actions 每晚記錄的歷史 + Worker 抓到的最新一天
  // 外資連續買（正）或賣（負）超的天數
  function foreignStreakDays(inst, history) {
    if (!inst?.date) return 0;
    const byDate = new Map((history?.days ?? []).map((d) => [d.date, d.foreign]));
    byDate.set(inst.date, inst.foreign);
    const values = [...byDate.entries()].filter(([d]) => d <= inst.date).sort().map(([, v]) => v);
    const sign = Math.sign(values.at(-1) ?? 0);
    let n = 0;
    for (let i = values.length - 1; i >= 0 && sign && Math.sign(values[i]) === sign; i--) n++;
    return sign * n;
  }

  // 外資連買/賣 badge：買紅、賣綠。旁邊有「史上第N名」時省略「外資」兩字，窄螢幕才放得下
  function foreignStreak(inst, history, short) {
    const streak = foreignStreakDays(inst, history);
    const sign = Math.sign(streak);
    if (!sign) return '';
    return `<span class="badge ${sign > 0 ? 'up' : 'down'}">${short ? '' : '外資'}連${Math.abs(streak)}${sign > 0 ? '買' : '賣'}</span>`;
  }

  // 外資買超／賣超史上排行：當天的金額放進排行（foreign_records.json，每晚併入新的交易日），前 10 名才顯示。
  // 少見的大事件，用實心底色
  function foreignRankBadge(inst) {
    const v = inst?.foreign;
    if (!foreignRecords || !v) return '';
    const side = v > 0 ? 'buy' : 'sell';
    const list = (foreignRecords[side] ?? []).filter((d) => d.date !== inst.date);
    const rank = 1 + list.filter((d) => (v > 0 ? d.foreign > v : d.foreign < v)).length;
    if (rank > 10) return '';
    return `<span class="badge ${v > 0 ? 'buy' : 'sell'}">外資${v > 0 ? '買' : '賣'}超史上第${rank}名</span>`;
  }


  // 三大法人買賣超：一直顯示；當日 15:10 到下個交易日 08:00 是新資料（彩色），其餘時間整塊轉灰
  function institutionalHtml(inst, history) {
    if (!inst?.date) return '';
    const [, m, d] = inst.date.split('-').map(Number);

    // 合計當主數字，三大法人各自的買賣超一行小字
    const dir = (v) => (v > 0 ? 'up' : v < 0 ? 'down' : '');
    const num = (v) => `${v > 0 ? '+' : ''}${fmt(v, 1)}`;
    const rank = foreignRankBadge(inst);
    const parts = [['外資', inst.foreign], ['投信', inst.trust], ['自營', inst.dealer]]
      .map(([k, v]) => `<span class="txt">${k}</span> <span class="${dir(v)}">${num(v)}</span>`).join(' · ');
    return `
      <div class="card wide inst">
        <div class="head"><div class="name">三大法人買賣超</div><div class="badges">${rank}${foreignStreak(inst, history, !!rank)}</div></div>
        <div class="price ${dir(inst.total)}">${num(inst.total)}<small> 億</small></div>
        <div class="chg">${parts}</div>
        <div class="foot inst-foot"><div class="meta">${m}/${d} 盤後</div>${inst.share != null
          // 法人成交比重：三大法人買＋賣 ÷（大盤成交金額 × 2），中性說明
          ? `<span class="badge note">法人成交比重${fmt(inst.share, 0)}%</span>` : ''}</div>
      </div>`;
  }

  // 八大公股行庫買賣超（HiStock，每晚抓一次）。含公股券商的自營與客戶下單，不完全等於國家隊
  // 每晚排程的 gov_banks.json（長期歷史）＋ Worker 當天抓的最近 10 天（排程常延遲到半夜）
  function govBanksHtml(live, twii) {
    const byDate = new Map((govBanks?.days ?? []).map((d) => [d.date, d]));
    for (const d of live?.days ?? []) byDate.set(d.date, d);
    const days = [...byDate.values()].sort((a, b) => (a.date < b.date ? -1 : 1));
    const last = days.at(-1);
    if (!last) return '';
    // 連買/賣：單日不到 10 億（近 60 日約 8% 的日子）視為持平，跳過不算、也不打斷
    const big = days.filter((d) => Math.abs(d.net) >= 10);
    const sign = Math.sign(big.at(-1)?.net ?? 0);
    let n = 0;
    for (let i = big.length - 1; i >= 0 && Math.sign(big[i].net) === sign; i--) n++;
    // 護盤：大盤收跌的日子，官股買超佔當天成交金額 1.9% 以上（成交金額是 volume_profile.json 的
    // 一般交易時段總額，百萬元）。用比例而非固定金額，市場變大變小都適用；近 60 日 5 次，約 8%
    // 當天的成交金額排程還沒存：用加權卡片的成交金額（百萬元，同一天才用）
    const twiiDay = twii?.time ? new Date(twii.time + 8 * 3600000).toISOString().slice(0, 10) : null;
    const turnover = volumeProfile?.totals?.[last.date] ?? (twiiDay === last.date ? twii.turnover : null);
    const taiexPct = taiexChangePct(last.date, null);
    const sharePct = turnover ? ((last.net * 100) / turnover) * 100 : 0;  // 億→百萬，再換成 %
    const rescue = sharePct >= 1.9 && taiexPct != null && taiexPct < 0;
    const dir = last.net > 0 ? 'up' : 'down';
    const [, mm, dd] = last.date.split('-').map(Number);
    // 右上：連買/賣（狀態）；右下：護盤（有觸發才出現，灰色說明）；大數字放大跟左邊卡片對齊
    const streak = sign ? `<span class="badge ${sign > 0 ? 'up' : 'down'}">連${n}${sign > 0 ? '買' : '賣'}</span>` : '';
    const note = rescue ? '<span class="badge warn">護盤</span>' : '';
    return `
      <div class="card roomy">
        <div class="head"><div class="name">八大買賣超</div>${streak}</div>
        <div class="price ${dir}">${last.net > 0 ? '+' : ''}${fmt(last.net, 1)}<small> 億</small></div>
        <div class="foot"><div class="meta">${mm}/${dd} 盤後</div>${note}</div>
      </div>`;
  }

  function calendarHtml() {
    const tw = new Date(Date.now() + 8 * 3600 * 1000);
    const today = utcDate(tw.getUTCFullYear(), tw.getUTCMonth() + 1, tw.getUTCDate());
    // 只列明天，沒有事件就不顯示（週一的事件等到週日才出現）
    const tomorrow = addDays(today, 1);
    const nextEvents = dayEvents(tomorrow);
    const nextHtml = nextEvents.any ? `<div class="next"><span class="ico">📅</span><span>${dayLine('明日', tomorrow, nextEvents)}</span></div>` : '';
    return `
      <div class="card cal">
        <div class="today"><span class="ico">📅</span><span>${dayLine('今日', today, dayEvents(today))}</span></div>
        ${nextHtml}
      </div>`;
  }

  // "多1.3萬 空9.2萬" -> 各段拉開間距，標籤字轉灰色
  const segments = (text) => /\d/.test(text)
    ? text.split(' ').map((s) => `<span class="seg">${s.replace(/^([^\d+-]+)/, '<span class="k">$1</span>')}</span>`).join('')
    : text;

  // 淨未平倉從 prev 變成 cur 的白話描述
  function netOiChange(prev, cur) {
    const lots = (n) => `${fmt(Math.abs(n), 0)}口`;
    if (prev < 0 && cur >= 0) return `淨多${lots(cur)}`;  // 翻多
    if (prev >= 0 && cur < 0) return `淨空${lots(cur)}`;  // 翻空
    const side = cur < 0 ? '淨空' : '淨多';
    const grew = Math.abs(cur) > Math.abs(prev);
    return `${side}${grew ? '增' : '減'}${lots(cur - prev)}`;
  }

  // 外資期現同向：同一天現貨賣超 300 億以上、台指淨 OI 又減少 2,000 口以上＝期現雙空；反向＝期現雙多。
  // 門檻約為各自日變動的中位數，盤整時的小額買賣不算。
  // 回測 2023/11-2026/10（結算日除外）：期現雙空 36 天，隔天加權平均 -0.98%、36% 上漲（全部 +0.14%、57%），
  // p<0.001，2024-2026 每年都成立，5 天後 -0.20%（p=0.04），20 天後就沒差；期現雙多 14 天、隔天 +0.50%，不顯著，只當描述
  // 賣現補空（跟上面兩個互斥）：現貨賣超 100 億以上、外資賣台積電、淨空單減少 1,000 口以上、加權收跌，結算日不算。
  // 回測 2023/11-2026/10：38 天（約每月一次），隔天加權平均 +1.00%、66% 上漲（一般下跌日 +0.11%、55%），
  // 2024-2026 每年都成立；20 天後沒有優勢。拿掉最大的三次反彈（含 2025/4/9）就不顯著，所以只當描述
  function futuresSpotBadge(q, inst, flows, twii) {
    if (q.change == null || !inst?.date || !q.time) return '';
    const day = new Date(q.time + 8 * 3600000).toISOString().slice(0, 10);
    if (inst.date !== day) return '';
    if (inst.foreign <= -300 && q.change <= -2000) return '<span class="badge sell">期現雙空</span>';
    if (inst.foreign >= 300 && q.change >= 2000) return '<span class="badge buy">期現雙多</span>';
    const d = new Date(day + 'T00:00:00Z');
    const settlement = d.getUTCDay() === 3 && d.getUTCDate() >= 15 && d.getUTCDate() <= 21;  // 第三個星期三
    const tsmc = flows?.foreign?.date === day ? flows.foreign.net?.['2330'] : null;
    const taiex = taiexChangePct(day, twii);
    if (!settlement && inst.foreign <= -100 && tsmc < 0 && q.price < 0 && q.change >= 1000 && taiex < 0) {
      return '<span class="badge buy">賣現補空</span>';  // 紅：回測隔天偏多（跟期現雙空的綠相對）
    }
    return '';
  }

  function dailyHtml(q, inst, flows, twii, vix) {
    const dir = q.price > 0 ? 'up' : q.price < 0 ? 'down' : '';
    const sign = q.price > 0 ? '+' : '';
    const value = q.unit === 'ratio' ? `${sign}${fmt(q.price, q.digits)}%` : `${sign}${fmt(q.price, q.digits)}<small> 口</small>`;
    // 跟前一個交易日比：多空比用百分點；淨 OI 用白話描述（淨空增/減、翻多…），對多方有利紅、不利綠
    // 「較前日」獨立一行，放在日期上方
    let change = '';
    if (q.change != null) {
      const cdir = q.change > 0 ? 'up' : q.change < 0 ? 'down' : '';
      const text = q.unit === 'ratio'
        ? `${q.change > 0 ? '+' : ''}${fmt(q.change, 2)}pp`
        : netOiChange(q.price - q.change, q.price);
      change = `<div class="cmp"><span class="txt">較前日</span> <span class="${cdir}">${text}</span></div>`;
    }
    // 散戶多空比是反向指標（2020-2026 回測）：< 0 散戶轉淨空＝燃料充足（綠），之後 10 / 20 日加權平均
    // +1.3% / +2.4%（全部 +1.0% / +1.9%）。
    // > +30% 且同一天台指 VIX < 25（散戶大量做多、市場卻不恐慌）→ 橘色「FOMO」：之後 5 日加權平均 -1.4%、
    // 勝率 35%（15 段；全部 +0.5%、60%），10～20 日後多半漲回來，只是短線逆風，所以用描述色不用賣出色。
    // 單看 > 30% 跟平常差不多；VIX ≥ 25（恐慌中散戶抄底）之後一週反而偏漲，都不標
    let badge = '';
    if (q.unit !== 'ratio') badge = futuresSpotBadge(q, inst, flows, twii);
    else if (q.price < 0) badge = '<span class="badge fuel">燃料充足</span>';
    else if (q.price > 30) {
      const [m, d] = String(q.dataDate).split('/').map(Number);
      const v = vixSeries(vix).find(([date]) => Number(date.slice(5, 7)) === m && Number(date.slice(8, 10)) === d)?.[1];
      if (v != null && v < 25) badge = '<span class="badge warn">FOMO</span>';
    }
    return `
      <div class="card roomy">
        <div class="head"><div class="name">${q.name}</div>${badge}</div>
        <div class="price ${dir}">${value}</div>
        ${change}
        <div class="meta">${q.dataDate} 盤後${q.stale ? ' · <span class="lag">舊資料</span>' : ''}</div>
      </div>`;
  }

  // 融資資料：Worker（21:00 後即時）優先；GitHub Actions 產生的 margin.json 當備援，
  // 也用來補 Worker 缺的「前一日維持率」
  function pickMargin(w, f) {
    if (!w) return f;
    if (!f || w.date > f.date) return { ...w, prev: w.prev ?? f?.ratio ?? null, history: f?.history };
    if (w.date === f.date) return { ...w, prev: w.prev ?? f.prev ?? null, history: f.history };
    return f;
  }

  // 融資連續增加/減少的天數（margin.json 的每日增減，Worker 較新的那天補在最後）；2 天以上才顯示
  function marginStreakBadge(m) {
    const days = (m.history ?? []).filter((h) => h.date < m.date).map((h) => h.balanceChange);
    days.push(m.balanceChange);
    const sign = Math.sign(days[days.length - 1]);
    let n = 0;
    while (n < days.length && sign && Math.sign(days[days.length - 1 - n]) === sign) n++;
    if (n < 2) return '';
    return `<span class="badge ${sign > 0 ? 'up' : 'down'}">連${n}${n === days.length ? '+' : ''}${sign > 0 ? '增' : '減'}</span>`;
  }

  // 右上沒有 badge 時放一個看不見的，標題列高度才跟隔壁一樣，大數字上下對齊
  const BADGE_SPACER = '<span class="badge" style="visibility:hidden">連0</span>';

  // 融資維持率連 N 天升／降（每晚存的每日維持率，2026/10/16 起累積），升紅降綠
  function marginRatioBadge(m) {
    const ratios = (m.history ?? []).filter((h) => h.date < m.date && h.ratio != null).map((h) => h.ratio);
    ratios.push(m.ratio);
    const diffs = ratios.slice(1).map((r, i) => r - ratios[i]);
    const sign = Math.sign(diffs.at(-1) ?? 0);
    let n = 0;
    while (n < diffs.length && sign && Math.sign(diffs[diffs.length - 1 - n]) === sign) n++;
    if (n < 2) return '';
    return `<span class="badge ${sign > 0 ? 'up' : 'down'}">連${n}${sign > 0 ? '增' : '減'}</span>`;
  }

  // 上市融資維持率
  function marginHtml(m) {
    const [, mm, dd] = m.date.split('-').map(Number);
    const d = m.prev != null ? m.ratio - m.prev : null;
    const cmp = d == null ? '' : `<div class="cmp"><span class="txt">較前日</span> <span class="${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${d > 0 ? '+' : ''}${fmt(d, 2)}pp</span></div>`;
    return `
      <div class="card roomy">
        <div class="head"><div class="name">上市融資維持率</div>${marginRatioBadge(m) || BADGE_SPACER}</div>
        <div class="price">${fmt(m.ratio, 2)}%</div>
        ${cmp}
        <div class="foot"><div class="meta">${mm}/${dd} 盤後</div>${m.ratio <= 140 ? '<span class="badge warn">斷頭</span>' : ''}</div>
      </div>`;
  }

  // 百萬元 -> "9760億" / "1.05兆"（不加千分位，badge 才放得下）
  function money(millions) {
    const yi = millions / 100;
    return yi >= 10000 ? `${(yi / 10000).toFixed(2)}兆` : `${Math.round(yi)}億`;
  }

  // 價差 = 台指期 - 加權指數
  // 每晚存的日收盤（global_history.json）+ 即時報價當最新一天；檔案落後一天時用報價的昨收補上
  // 歷史日收盤的日期是各交易所當地日期；即時報價那天（或之後）的歷史收盤先拿掉，避免同一天算兩次
  const MARKET_TZ = { sox: 'America/New_York', nq: 'America/New_York', us10y: 'America/New_York', tsm: 'America/New_York',
    brent: 'America/New_York', kospi: 'Asia/Seoul', nikkei: 'Asia/Tokyo' };
  function dailySeries(q) {
    const quoteDay = q?.time ? new Intl.DateTimeFormat('en-CA', { timeZone: MARKET_TZ[q.id] ?? 'Asia/Taipei' }).format(new Date(q.time)) : null;
    const closes = (globalHistory?.[q?.id] ?? []).filter((c) => !quoteDay || c.date < quoteDay).map((c) => c.close);
    if (!q?.price || !closes.length) return [];
    if (q.prev != null && Math.abs(closes.at(-1) - q.prev) > Math.abs(q.prev) * 1e-6) closes.push(q.prev);
    return [...closes, q.price];
  }

  // 美債 10Y：5 個交易日殖利率上升 20bp 以上＝殖利率急升（壓抑科技股評價）
  // 5 個交易日的殖利率變動（bp）
  function yield5Bp(q) {
    const series = dailySeries(q);
    return series.length < 6 ? null : (series.at(-1) - series.at(-6)) * 100;
  }

  function us10yBadge(q) {
    return yield5Bp(q) >= 20 ? '<span class="badge warn">殖利率急升</span>' : '';
  }

  // 月線（20 日均線）距離（%）
  function monthLineGap(q, n = 20) {
    const series = dailySeries(q).slice(-n);
    if (series.length < n) return null;
    return (q.price / (series.reduce((a, b) => a + b, 0) / n) - 1) * 100;
  }

  // USD/TWD 5 個交易日的變動（%），正＝美元漲＝台幣貶（外匯日線對不上昨收，不補昨收）
  function twd5Move(q) {
    const closes = (globalHistory?.usdtwd ?? []).map((c) => c.close);
    return !q?.price || closes.length < 5 ? null : (q.price / closes.at(-5) - 1) * 100;
  }

  // 月線（20 日）、季線（60 日）哪條離現價近：badge 和週K的虛線都用這條（跌離月線、靠近季線時改看季線）
  function nearerMa(q) {
    const m = monthLineGap(q);
    const s = monthLineGap(q, 60);
    return s != null && m != null && Math.abs(s) < Math.abs(m) ? 60 : 20;
  }

  // 國際指數的均線距離
  function monthLineBadge(q) {
    const n = nearerMa(q);
    const gap = monthLineGap(q, n);
    if (gap == null) return '';
    const name = n === 60 ? '季線' : '月線';
    return `<span class="badge ${gap > 0 ? 'up' : gap < 0 ? 'down' : ''}">${name}${gap > 0 ? '+' : ''}${fmt(gap, 1)}%</span>`;
  }

  // USD/TWD：5 個交易日的變動（每晚存的日收盤 + 即時報價）。台幣貶超過 1% 且外資連賣 3 天以上＝資金外流；
  // 反向＝資金回流；只有匯率大動、外資沒同方向＝台幣急貶/急升（灰）；其他不顯示
  function usdtwdBadge(q, inst, history) {
    const move = twd5Move(q);
    if (move == null || Math.abs(move) < 1) return '';
    const streak = foreignStreakDays(inst, history);
    if (move > 0 && streak <= -3) return '<span class="badge warn">資金外流</span>';
    if (move < 0 && streak >= 3) return '<span class="badge buy">資金回流</span>';
    return `<span class="badge note">台幣急${move > 0 ? '貶' : '升'}</span>`;
  }

  function basisBadge(txf, twii) {
    if (txf?.price == null || twii?.price == null) return '';
    const b = Math.round(txf.price - twii.price);
    const [label, dir] = b > 0 ? ['正價差', 'up'] : b < 0 ? ['逆價差', 'down'] : ['平價', ''];
    return `<span class="badge ${dir}">${label}${b > 0 ? '+' : ''}${b}</span>`;
  }

  // 量能顏色：成交（或估量）÷ 前 5 個交易日平均。≤0.8 量縮灰、≥1.2 放量黃、≥1.5 爆量橘
  function volumeClass(amount, twii, profile) {
    const day = new Date(twii.time + 8 * 3600000).toISOString().slice(0, 10);
    const prior = Object.entries(profile?.totals ?? {}).filter(([d]) => d < day).sort().slice(-5).map(([, v]) => v);
    if (prior.length < 5) return '';
    const ratio = amount / (prior.reduce((a, b) => a + b, 0) / prior.length);
    return ratio >= 1.5 ? ' vol-hot' : ratio >= 1.2 ? ' vol-high' : ratio <= 0.8 ? ' vol-low' : '';
  }

  // 盤中：累積成交金額 ÷ 過去 5 日同一分鐘的成交占比；收盤後：實際成交金額
  function turnoverBadge(twii, profile) {
    if (!twii?.turnover) return '';
    const minute = hhmm(twii.time);
    if (twii.state !== 'open' || minute >= '13:30') {
      return `<span class="badge${volumeClass(twii.turnover, twii, profile)}">成交${money(twii.turnover)}</span>`;
    }
    const share = profile?.share?.[minute];
    if (minute < '09:05' || !share) return '';
    const estimate = twii.turnover / share;
    // 開盤頭 30 分鐘估量誤差大，先不變色
    const cls = minute >= '09:30' ? volumeClass(estimate, twii, profile) : '';
    return `<span class="badge${cls}">估${money(estimate)}</span>`;
  }

  // 漲跌家數：「拉雞盤」＝台積電漲 1% 以上硬扛、加權漲，但扣掉台積電後指數其實沒漲，且下跌家數較多。
  // （台積電漲不到 1% 的牛皮盤不算）
  // 台積電貢獻點數 ≈ 昨收指數 × 台積電市值比重（期交所，每晚更新）× 台積電漲跌幅
  function breadthHtml(q, twii, tw2330, etf) {
    // 漲跌家數沒有時間戳，分不出是不是今天的：交易日 09:00 起到 00685L 有今天的報價為止，顯示「尚未更新」
    const tw = new Date(Date.now() + 8 * 3600000);
    const today = tw.toISOString().slice(0, 10);
    const etfDay = etf?.time ? new Date(etf.time + 8 * 3600000).toISOString().slice(0, 10) : null;
    if (!isMarketHoliday('tw') && tw.getUTCHours() >= 9 && etfDay !== today) {
      return `
      <div class="card wide flat">
        <div class="head"><div class="name">${q.name}</div><span class="bcnt pend-txt">尚未更新</span></div>
      </div>`;
    }
    const weight = tsmcWeight?.weight;
    const tsmcPoints = weight && tw2330?.changePct != null && twii?.prev
      ? twii.prev * (weight / 100) * (tw2330.changePct / 100) : null;
    const pulled = twii?.change > 0 && tw2330?.changePct >= 1 && tsmcPoints != null && twii.change - tsmcPoints <= 0 && q.down > q.up;
    // 「壓雞盤」＝反過來：台積電沒漲（≤ 0%）、加權漲，扣掉台積電後的指數漲 0.5% 以上，且上漲家數較多。
    // 回測 2025/10–2026/10：241 個交易日中 25 天（約 10%），2026/10/16 就是（加權 +0.95%、台積電平盤、976 漲 129 跌）
    const exPct = tsmcPoints != null && twii?.prev ? ((twii.change - tsmcPoints) / (twii.prev * (1 - weight / 100))) * 100 : null;
    const pressed = twii?.change > 0 && tw2330?.changePct <= 0 && exPct >= 0.5 && q.up > q.down;
    const badge = pulled ? '<span class="badge warn">拉雞盤</span>' : pressed ? '<span class="badge warn">壓雞盤</span>' : '';
    return `
      <div class="card wide flat">
        <div class="head"><div class="name">${q.name}</div><span class="bcnt"><span class="up">▲${q.up}</span><span class="down brd-dn">▼${q.down}</span></span>${badge}</div>
      </div>`;
  }

  // 融資餘額日增減（億元），GitHub Actions 每晚計算
  function marginBalanceHtml(m) {
    if (m?.balanceChange == null) return '';
    const [, mm, dd] = m.date.split('-').map(Number);
    const c = m.balanceChange;
    const dir = c > 0 ? 'up' : c < 0 ? 'down' : '';
    return `
      <div class="card roomy">
        <div class="head"><div class="name">上市融資增減</div>${marginStreakBadge(m) || BADGE_SPACER}</div>
        <div class="price ${dir}">${c > 0 ? '+' : ''}${fmt(c, 1)}<small> 億</small></div>
        <div class="cmp"><span class="txt">餘額</span> <span>${fmt(m.balance, 0)}億</span></div>
        <div class="foot"><div class="meta">${mm}/${dd} 盤後</div></div>
      </div>`;
  }

  // 迷你 15 分 K：18 個時段（09:00-13:30），虛線為昨收
  // line：可選，每根 K 棒對應一個值（例如 20 週均線），畫成虛線折線，取代水平的昨收線
  function miniCandles(candles, prev, line) {
    const bars = candles.map((c, i) => c && { i, o: c[0], h: c[1], l: c[2], c: c[3] }).filter(Boolean);
    if (!bars.length) return '';
    const lineVals = (line ?? []).filter((v) => v != null);
    let lo = Math.min(prev ?? Infinity, ...lineVals, ...bars.map((b) => b.l));
    let hi = Math.max(prev ?? -Infinity, ...lineVals, ...bars.map((b) => b.h));
    // 有昨收（當天的 K）：整張圖至少涵蓋昨收的 2%（不夠就上下各撐開一半），平淡的日子 K 棒只佔中間一小段，
    // 大漲大跌才撐滿整張圖；週 K 不傳昨收，照舊撐滿
    if (prev != null && hi - lo < prev * 0.02) {
      const mid = (hi + lo) / 2;
      lo = mid - prev * 0.01;
      hi = mid + prev * 0.01;
    }
    // 上下各留 8% 內距：跳空時昨收虛線剛好是最高／最低，貼在 SVG 邊緣會被裁掉看不見
    const y = (v) => (hi === lo ? 50 : 8 + ((hi - v) / (hi - lo)) * 84);
    const w = 7;
    const parts = bars.map((b) => {
      const color = b.c >= b.o ? 'var(--up)' : 'var(--down)';
      const top = y(Math.max(b.o, b.c));
      const height = Math.max(2, y(Math.min(b.o, b.c)) - top);
      const x = b.i * w;
      return `<line x1="${x + 3.5}" x2="${x + 3.5}" y1="${y(b.h)}" y2="${y(b.l)}" stroke="${color}" vector-effect="non-scaling-stroke"/>`
        + `<rect x="${x + 1.5}" y="${top}" width="4" height="${height}" fill="${color}"/>`;
    });
    const pts = (line ?? []).map((v, i) => (v == null ? null : `${i * w + 3.5},${y(v)}`)).filter(Boolean);
    const base = pts.length > 1
      ? `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--muted)" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>`
      : prev == null ? '' : `<line x1="0" x2="${candles.length * w}" y1="${y(prev)}" y2="${y(prev)}" stroke="var(--muted)" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>`;
    return `<svg class="kchart" viewBox="0 0 ${candles.length * w} 100" preserveAspectRatio="none" aria-hidden="true">${base}${parts.join('')}</svg>`;
  }

  // 大盤均線：每晚存的加權收盤（taiex_history.json）+ 即時指數當最新一天
  let taiexHistory = null;
  let vixHistory = null;
  let volumeProfile = null;  // 每日成交金額（totals），護盤判斷用
  let govBanks = null;  // 八大公股行庫每日買賣超
  let txCost = null;  // 外資台指期淨部位推估均價（tx_cost.json，自訂估算模型）
  let foreignRecords = null;  // 外資買超／賣超史上排行（foreign_records.json）
  let globalHistory = null;  // 費半、小納、韓股、日經的日收盤，月線 badge 用
  let tsmcWeight = null;  // 台積電市值佔大盤比重（%），拉雞盤判斷用

  // 台指 VIX：每晚累積的歷史（vix_history.json）+ Worker 抓到的最新收盤。
  // 百分位看位置、5 日變化看方向；百分位 ≥90 且當天回落 → 「高檔回落」（今年兩次底部的訊號）
  // 加權在某一天的漲跌幅（%）：每晚的歷史收盤，今天則用即時指數
  function taiexChangePct(date, twii) {
    const byDate = new Map((taiexHistory?.closes ?? []).map((c) => [c.date, c.close]));
    if (twii?.price && new Date(twii.time + 8 * 3600000).toISOString().slice(0, 10) === date) {
      return twii.changePct;
    }
    const dates = [...byDate.keys()].sort();
    const i = dates.indexOf(date);
    return i > 0 ? (byDate.get(date) / byDate.get(dates[i - 1]) - 1) * 100 : null;
  }

  // 每晚的歷史 + Worker 的最新收盤，[[YYYY-MM-DD, 收盤], …] 由舊到新
  function vixSeries(vix) {
    const byDate = new Map((vixHistory?.closes ?? []).map((c) => [c.date, c.close]));
    for (const c of vix?.closes ?? []) byDate.set(c.date, c.close);
    return [...byDate.entries()].sort(([a], [b]) => (a < b ? -1 : 1));
  }
  function vixHtml(vix, twii) {
    const series = vixSeries(vix);
    if (series.length < 2) return '';
    const [lastDate, last] = series.at(-1);
    const prev = series.at(-2)[1];
    const change = last - prev;
    // 漲跌顏色跟其他卡片一致：漲紅、跌綠（只是方向，不代表 VIX 上漲是好事）
    const dir = (v) => (v > 0 ? 'up' : v < 0 ? 'down' : '');
    const sign = (v) => (v > 0 ? '+' : '');
    // VIX 超過 40 → 橘色「極度恐慌」，優先。只是描述狀態：2016-2026 第一次破 40 共 7 次，之後 60 日都上漲，
    // 但「存現金等 VIX 破 40 再投入」回測並沒有比固定日期投入好，所以不寫成買進指令。
    // 單日跳升 3 點以上（有人急著買保護）→ 橘色「急升」；
    // 加權漲 0.5% 以上、VIX 卻也漲 1 點以上（漲勢中有人買保護，常是後繼無力）→ 橘色「大盤漲得心虛」
    const taiexPct = taiexChangePct(lastDate, twii);
    const badge = last > 40
      ? '<span class="badge warn">極度恐慌</span>'
      : change >= 3
        ? '<span class="badge warn">急升</span>'
        : taiexPct >= 0.5 && change >= 1
          ? '<span class="badge warn">大盤漲得心虛</span>'
          : '';
    const [, mm, dd] = lastDate.split('-').map(Number);
    return `
      <div class="card roomy">
        <div class="head"><div class="name">台指VIX</div>${badge}</div>
        <div class="price">${fmt(last, 2)}</div>
        <div class="chg ${dir(change)}">${sign(change)}${fmt(change, 2)} (${sign(change)}${fmt((change / prev) * 100, 1)}%)</div>
        <div class="foot"><div class="meta">${mm}/${dd} 盤後</div></div>
      </div>`;
  }

  // 我的持股：代號、價格、漲跌幅

  // 新聞快訊：金十 xnews 標題含關鍵字的最新 5 則（Worker 篩選、簡轉繁、30 分鐘抓一次），一次一則、點卡片換下一則
  let jin10Page = 0;
  let jin10Key = null;
  let jin10Keys = [];
  let jin10Top = null;  // 上次畫的時候最新那則，用來判斷有沒有新新聞
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // 防呆：金十資料有任何問題（沒資料、格式不對、畫卡片出錯）就整張不顯示，不影響其他卡片
  function jin10Html(j) {
    try { return jin10Card(j); } catch { return ''; }
  }
  function jin10Card(j) {
    const items = (Array.isArray(j?.items) ? j.items : []).filter((x) => x?.title && x.time).slice(0, 5);
    if (!items.length) return '';
    // 有新的一則進來（最新那則換了）就跳到第一則；沒有新的就停在原本看的那則（用時間＋標題當識別），被擠掉了才回第一則
    const keyOf = (x) => `${x.title}`;
    const fresh = jin10Top != null && keyOf(items[0]) !== jin10Top;
    jin10Top = keyOf(items[0]);
    const keep = items.findIndex((x) => keyOf(x) === jin10Key);
    jin10Page = fresh ? 0 : keep >= 0 ? keep : (jin10Page < items.length && jin10Key == null ? jin10Page : 0);
    jin10Key = keyOf(items[jin10Page]);
    jin10Keys = items.map(keyOf);
    const pages = items.map((x, i) => `<div class="jp" data-i="${i}"><div class="jt">${esc(x.title)}</div></div>`).join('');
    // 已讀：時間右邊一個淡藍色勾勾（Outlook 的藍）；未讀沒有。在畫面上顯示超過 2 秒就算讀過
    const read = readNews();
    if (!read.size) { for (const x of items) read.add(x.title); saveReadNews(read); }  // 第一次：當下的都算讀過
    const times = items.map((x, i) => `<span class="jtime" data-i="${i}">${mdhm(x.time)}`
      + `${read.has(x.title) ? READ_MARK : ''}</span>`).join('');
    return `
      <div class="card wide jin10 pager" data-p="${jin10Page}" data-n="${items.length}">
        <div class="head"><div class="name">新聞快訊</div>${times}${items.length > 1 ? items.map((_, i) => `<span class="pg" data-i="${i}">${i + 1}/${items.length}</span>`).join('') : ''}</div>
        ${pages}
      </div>`;
  }

  // 小遊戲：第一次要用時才載入，之後每次重畫把同一個遊戲元素搬回原位。主帳號是戰鎚（docs/game.js），
  // love 帳號是自己的遊戲（docs/love.js、素材在 docs/love/）：只載入登入帳號的那一套，另一套的檔案完全不抓
  const GAMES = { owner: ['game.js?v=116', 'WarGame'], love: ['love.js?v=17', 'LoveGame'] };
  const gameLoading = {};
  function attachGame(d) {
    const [src, name] = GAMES[window.PrivateVault?.profile?.()] ?? GAMES.owner;
    gameLoading[src] ??= new Promise((ok) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = ok;
      document.head.appendChild(s);
    });
    gameLoading[src].then(() => {
      const slot = document.getElementById('game-slot');
      if (slot && window[name]) window[name].attach(slot, d);
    });
  }

  // 新聞快訊的已讀紀錄（這台裝置，存標題，最多 100 則）
  const READ_MARK = '<svg class="readmark" viewBox="0 0 16 16" aria-label="已讀"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function readNews() {
    try { return new Set(JSON.parse(localStorage.getItem('newsRead') ?? '[]')); } catch { return new Set(); }
  }
  function saveReadNews(set) {
    try { localStorage.setItem('newsRead', JSON.stringify([...set].slice(-100))); } catch {}
  }
  // 某則在畫面上顯示超過 2 秒（網頁在前景）就算讀過：記下來、加上藍勾
  let readTimer = null;
  function scheduleRead() {
    clearTimeout(readTimer);
    readTimer = setTimeout(() => {
      const card = $list.querySelector('.jin10');
      if (card && !document.hidden) markRead(card, card.dataset.p);
    }, 2000);
  }
  function markRead(card, i) {
    const title = card.querySelector(`.jp[data-i="${i}"] .jt`)?.textContent;
    const time = card.querySelector(`.jtime[data-i="${i}"]`);
    if (!title || !time || time.querySelector('.readmark')) return;
    const read = readNews();
    read.add(title);
    saveReadNews(read);
    time.insertAdjacentHTML('beforeend', READ_MARK);
  }

  // 我的持股：全寬卡片分兩欄（2330、00685L | 0056、00878）
  const HOLD_GROUPS = [['2330', '00685L'], ['0056', '00878']];

  // 個股外資／投信買賣超（張）：盤後公布後才顯示，到隔天開盤（09:00）就隱藏，直到當天的公布為止
  function flowVisible(t) {
    if (!t?.date || !t.net) return false;
    const tw = new Date(Date.now() + 8 * 3600000);
    const today = tw.toISOString().slice(0, 10);
    const mins = tw.getUTCHours() * 60 + tw.getUTCMinutes();
    return t.date === today || isMarketHoliday('tw') || mins < 9 * 60;
  }

  // 00685L 複利差：每筆買進 100 ×［(L−1) − 2(G−1)］，G＝Π(1+r)、L＝Π(1+2r)，r＝加權（價格指數）日報酬。
  // 正＝複利加速（紅）、負＝磨損（綠），跟全站紅漲綠跌一致
  let twiiQuote = null;
  // 持股版：私人頁填了 00685L 買進紀錄，每筆從買進日收盤到今天各算一次複利差，依當時投入金額加權（張數 × 理想正2 淨值，
  // 淨值用加權每天 2 倍推出來）。買進日早於歷史資料、或資料不足回 null
  function holdingCompounding(buys, twii) {
    const closes = taiexHistory?.closes;
    if (!buys?.length || !twii?.price || !closes?.length) return null;
    const day = new Date(twii.time + 8 * 3600000).toISOString().slice(0, 10);
    const pts = [...closes.filter((c) => c.date < day), { date: day, close: twii.price }];
    const nav = [1];
    for (let i = 1; i < pts.length; i++) nav.push(nav[i - 1] * (1 + 2 * (pts[i].close / pts[i - 1].close - 1)));
    const last = pts.length - 1;
    let w = 0;
    let sum = 0;
    for (const [d, n] of buys) {
      if (d < pts[0].date) return null;
      let i = last;
      while (pts[i].date > d) i--;  // 買進日（遇到休市取前一個交易日）的收盤
      const gap = (nav[last] / nav[i] - 1) - 2 * (pts[last].close / pts[i].close - 1);
      w += n * nav[i];
      sum += n * nav[i] * gap;
    }
    return w ? (100 * sum) / w : null;
  }

  // 方塊下半部點一下切換第 2 頁：2330＝月線、季線（每晚存的日收盤 + 即時價當最新一天）；
  // 0056、00878＝殖利率（etf_yield.json：最近 4 次已除息配息率加總，自訂歷史配息率指標）
  const lowerPage = {};
  let etfYield = null;
  // 八大買賣台積電（億）：當天有進八大買超／賣超前 30 名才有，排程的 JSON 和 Worker 取最新那天；沒有回 null
  let govLive = null;
  function govTsmc() {
    const last = govLast();
    return [govBanks?.tsmc, govLive?.tsmc].filter((t) => t?.date === last).at(-1) ?? null;
  }
  const govLast = () => [...(govBanks?.days ?? []), ...(govLive?.days ?? [])].map((d) => d.date).sort().at(-1);

  function lowerToggle(h, firsts, kMode) {
    let second = '';
    // 2330 外資、投信後面那頁：八大公股行庫買賣台積電；沒進前 30 名寫「—」。
    // 跟外資、投信一樣看時間：盤中換成 15 分 K 時不出現；當天還沒公布寫灰色「未公布」
    let gov = '';
    if (h.code === '2330' && !kMode) {
      const t = govTsmc();
      const v = !flowVisible({ date: govLast(), net: {} }) ? '<b class="fp">未公布</b>'
        : t ? `<b class="${t.net > 0 ? 'up' : t.net < 0 ? 'down' : ''}">${t.net > 0 ? '+' : ''}${fmt(t.net, 1)}億</b>` : '<b>—</b>';
      gov = `<div class="fl ma"><span class="wide">公股 ${v}</span></div>`;
    }
    if (h.code === '2330') {
      const today = new Date(Date.now() + 8 * 3600000).toISOString().slice(0, 10);
      const closes = [...(globalHistory?.tw2330 ?? []).filter((c) => c.date < today).map((c) => c.close), h.price];
      const ma = (n) => (closes.length >= n ? closes.slice(-n).reduce((a, b) => a + b, 0) / n : null);
      const v = (x) => `<b>${x == null ? '—' : fmt(Math.round(x), 0)}</b>`;
      second = `<div class="fl ma"><span>月 ${v(ma(20))}</span><span>季 ${v(ma(60))}</span></div>`;
    } else if (h.code === '00685L' && privateLots?.buys?.['00685L']?.length) {
      // 理想每日正2 相對「大盤整段報酬 × 2」的複利差（pp），盤中今天用即時指數。
      // 正的＝複利加速、負的＝波動損耗（字白色，數值紅綠、不帶正負）
      // 只在私人頁有填買進紀錄時才有這頁（用持股算）；沒填就不放，00685L 下半部一直是 15 分 K
      const x = holdingCompounding(privateLots.buys['00685L'], twiiQuote);
      const r = x == null ? null : Math.round(x * 10) / 10;
      const cls = r > 0 ? 'up' : r < 0 ? 'down' : '';
      second = `<div class="fl ma cmp2"><span class="wide">${r == null ? '複利差 <b class="fp">資料不足</b>'
        : `${r >= 0 ? '複利加速' : '波動損耗'} <b class="${cls}">${Math.abs(r).toFixed(1)}pp</b>`}</span></div>`;
    } else if (h.code === '0056' || h.code === '00878') {
      const y = etfYield?.[h.code]?.yield;
      second = `<div class="fl ma"><span class="wide">殖利率 <b>${Number.isFinite(y) ? `${y.toFixed(2)}%` : '—'}</b></span></div>`;
    }
    const pages = [...firsts, gov, second].filter(Boolean);
    if (pages.length < 2) return pages[0] ?? '';
    const p = (lowerPage[h.code] ?? 0) % pages.length;
    return `<div class="tsw" data-code="${h.code}" data-n="${pages.length}" data-p="${p}">${pages.map((x, i) => `<div class="pg" data-i="${i}">${x}</div>`).join('')}</div>`;
  }

  function holdingsHtml(list, twii, flows, gov) {
    twiiQuote = twii;
    govLive = gov;
    if (!list?.length) return '';
    // 台積電收盤集合競價（13:25-13:30）比盤中最後一筆漲 2 檔以上＝尾盤拉雞，跌 2 檔以上＝尾盤殺雞
    const auction = list.find((h) => h.code === '2330')?.auction;
    // 橘色（提醒色）：描述尾盤集合競價的動作，不代表之後的方向
    const badge = auction?.ticks >= 2 ? '<span class="badge warn">尾盤拉雞</span>'
      : auction?.ticks <= -2 ? '<span class="badge warn">尾盤殺雞</span>' : '';
    const groups = HOLD_GROUPS.map((codes) => list.filter((h) => codes.includes(h.code))).filter((g) => g.length);
    const fo = flowVisible(flows?.foreign) ? flows.foreign : null;
    const tr = flowVisible(flows?.trust) ? flows.trust : null;
    // 這行固定顯示（版面不跳動）；還沒公布或盤中就寫灰色「未公布」
    const flowSeg = (label, t, code) => {
      const v = t?.net?.[code];
      // 顯示金額（億）：證交所只公布張數，用 張數 × 收盤價 估算（Goodinfo 也是估），跟實際成交均價差約當天的波動幅度。
      // 單位依大小：1 億以上用億（百億以上不帶小數，窄螢幕才放得下；十億以上一位、以下兩位），
      // 不到 1 億用千萬、不到 1 千萬用百萬（一位小數；不到 1 百萬兩位）
      const price = list.find((x) => x.code === code)?.price;
      const yi = v != null && price ? (v * 1000 * price) / 1e8 : null;
      const a = Math.abs(yi ?? 0);
      const text = yi == null ? fmt(v, 0) : yi === 0 ? '0'
        : a >= 1 ? `${fmt(yi, a >= 100 ? 0 : a >= 10 ? 1 : 2)}億`
        : a >= 0.1 ? `${fmt(yi * 10, 1)}千萬`
        : `${fmt(yi * 100, a >= 0.01 ? 1 : 2)}百萬`;
      const val = v == null ? '<span class="fp">未公布</span>'
        : `<span class="${v > 0 ? 'up' : v < 0 ? 'down' : ''}">${v > 0 ? '+' : ''}${text}</span>`;
      return `<span class="wide"><span class="fk">${label}</span>${val}</span>`;
    };
    // 盤中（交易日 09:00-15:00）整行隱藏但保留高度：卡片大小不變，也不會看到一排「未公布」的雜訊
    const twNow = new Date(Date.now() + 8 * 3600000);
    const nowMins = twNow.getUTCHours() * 60 + twNow.getUTCMinutes();
    // 盤中到外資／投信公布前，這一行改畫 15 分 K（高度跟外/投那一行一樣，卡片大小不變）；公布後換回外/投
    const todayTw = twNow.toISOString().slice(0, 10);
    const published = [fo, tr].some((t) => t?.date === todayTw);
    const kMode = !isMarketHoliday('tw') && nowMins >= 9 * 60 && !published;
    const flowLine = (h) => {
      if (kMode || (h.code === '00685L' && !privateLots?.buys?.['00685L']?.length)) {
        const chart = h.candles ? miniCandles(h.candles, h.prev ?? (h.change != null ? h.price - h.change : null)) : '';
        return [`<div class="fl hk">${chart}</div>`];
      }
      // 2330 外資、投信各一頁；0056、00878 只放外資（投信買賣自家 ETF 沒什麼參考價值）；
      // 00685L 都不放（外資買賣槓桿 ETF 也沒什麼參考價值），只剩複利差那頁
      const pg = (label, t) => `<div class="fl">${flowSeg(label, t, h.code)}</div>`;
      return h.code === '00685L' ? [] : h.code === '2330' ? [pg('外資', fo), pg('投信', tr)] : [pg('外資', fo)];
    };
    const row = (h) => {
      const dir = h.change > 0 ? 'up' : h.change < 0 ? 'down' : '';
      const sign = h.change > 0 ? '+' : '';
      // 平盤用「■」當錨點、數字固定寫 0.00，跟其他檔的寬度一致
      const arrow = h.change > 0 ? '▲ ' : h.change < 0 ? '▼ ' : h.change === 0 ? '■ ' : '';
      // 千元以上（2330）的漲跌補到 3 位數，寬度跟其他檔一致：5 → 5.00、20 → 20.0、100 → 100
      const abs = h.change == null ? null : Math.abs(h.change);
      const digits = h.price >= 1000 ? 0 : 2;  // 股價
      const chgDigits = h.price < 1000 ? 2 : abs < 10 ? 2 : abs < 100 ? 1 : 0;
      const chgText = h.change === 0 ? '0.00' : fmt(abs, chgDigits);
      return `<div class="hold"><div class="top"><span class="k">${h.code}</span><span class="c ${dir}">${arrow}${chgText}</span></div>`
        + `<div class="q ${dir}"><b>${fmt(h.price, digits)}</b><span class="p">(${sign}${fmt(h.changePct, 2)}%)</span></div>`
        + lowerToggle(h, flowLine(h), kMode) + '</div>';
    };
    // 依欄排：左欄第一組、右欄第二組（格線逐列填，所以交錯排列）
    const rows = Math.max(...groups.map((g) => g.length));
    const body = Array.from({ length: rows }, (_, i) => groups.map((g) => (g[i] ? row(g[i]) : '<div></div>')).join('')).join('');
    return `
      <div class="card wide holdings">
        <div class="head hhead"><div class="name">自選股</div><div class="badges">${badge}${pnlCapsule(list)}</div></div>
        <div class="holds">${body}</div>
        <div class="foot"><div class="meta">${timeState(list[0].time, list[0].fault ? 'fault' : twii?.state)}</div>${kMode ? '<span class="klabel">15分K</span>' : ''}</div>
      </div>`;
  }


  // 加權的月線乖離（%）：每晚存的收盤 + 即時指數當最新一天
  function taiexBias(twii) {
    const closes = taiexHistory?.closes;
    if (!twii?.price || !closes?.length) return null;
    const day = new Date(twii.time + 8 * 3600000).toISOString().slice(0, 10);
    const series = [...closes.filter((c) => c.date < day).map((c) => c.close), twii.price].slice(-20);
    if (series.length < 20) return null;
    return (twii.price / (series.reduce((a, b) => a + b, 0) / 20) - 1) * 100;
  }

  let txKPage = 0;  // 台指期下半部：0 外資空單成本、1 60 分K
  // 加權的月線（20 日）、季線（60 日）哪條離現價近：週K 的虛線畫這條（跟費半同一個規則）
  function twiiNearerMa(twii) {
    const closes = taiexHistory?.closes;
    if (!twii?.price || !closes?.length) return 20;
    const day = new Date(twii.time + 8 * 3600000).toISOString().slice(0, 10);
    const series = [...closes.filter((c) => c.date < day).map((c) => c.close), twii.price];
    if (series.length < 60) return 20;
    const gap = (n) => Math.abs(twii.price / (series.slice(-n).reduce((a, b) => a + b, 0) / n) - 1);
    return gap(60) < gap(20) ? 60 : 20;
  }

  // 外資空單成本（估）推到當天：每晚排程算到前一個交易日（tx_cost.json），15:00 期交所公布後，
  // 用外資淨 OI 卡片那份日報裡外資台指期當天的多空成交，照同一個模型（3d_rollover_net_oi_proxy_v1）往前推一天：
  // 淨部位同向加大 → 加大的口數用當天該方向成交均價加權；變小或持平 → 不變；歸零 → flat；翻向 → 用當天均價重新定錨。
  // 只在日子剛好接續（排程的淨 OI＝今天的前一日）才推；結算日模型要重新定錨，當天照樣顯示排程的值
  function txCostToday(tc, oi) {
    const t = oi?.trade;
    if (!t || oi.change == null || !oi.time) return tc;
    const day = new Date(oi.time + 8 * 3600000).toISOString().slice(0, 10);
    if (day <= tc.asOf || tc.netOi !== oi.price - oi.change) return tc;
    if (settlements(new Date(`${day}T00:00:00Z`)).some((l) => l.startsWith('台指期貨'))) return tc;
    const prev = tc.netOi;
    const now = oi.price;
    const side = now < 0 ? 'short' : 'long';
    const vwap = (s) => {
      const lots = s === 'short' ? t.shortLots : t.longLots;
      const amt = s === 'short' ? t.shortAmt : t.longAmt;
      return lots > 0 && amt > 0 ? (amt * 1000) / (lots * 200) : null;
    };
    let cost = tc.cost;
    if (now === 0) return { ...tc, asOf: day, netOi: now, side: 'flat', status: 'flat' };
    if (prev === 0 || (prev > 0) !== (now > 0)) cost = vwap(side);
    else if (Math.abs(now) > Math.abs(prev)) {
      const v = vwap(side);
      if (v == null) return tc;
      cost = (cost * Math.abs(prev) + v * (Math.abs(now) - Math.abs(prev))) / Math.abs(now);
    }
    if (!(cost > 0)) return tc;
    return { ...tc, asOf: day, netOi: now, side, cost, live: true };
  }

  // 各卡片所屬市場，用行事曆的休市日判斷「休市」或「收盤」
  const MARKET_OF = { twii: 'tw', txf: 'tw', breadth: 'tw', kospi: 'kr', nikkei: 'jp', sox: 'us', tsm: 'us', nq: 'us', us10y: 'us', brent: 'us' };
  const HOLIDAY_LABEL = { kr: '韓股休市', jp: '日股休市', us: '美股休市' };

  // 今天（該市場當地日期）休市：週末或國定假日
  function isMarketHoliday(market) {
    const twToday = new Date(Date.now() + 8 * 3600000).toISOString().slice(0, 10);
    // 美股用美東當地日期；日、韓跟台灣同一天
    const day = market === 'us' ? new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(new Date()) : twToday;
    const weekday = new Date(day + 'T00:00:00Z').getUTCDay();
    if (weekday === 0 || weekday === 6) return true;
    if (market === 'tw') return holidays.has(day);
    return (econEvents[day] ?? []).some((e) => e.label.startsWith(HOLIDAY_LABEL[market]));
  }

  // Worker 只能用交易時段猜：假日時 Yahoo 的時段跳到下一天（判成收盤），開盤初期延遲報價還沒出現（判成休市）。
  // 以行事曆為準：今天是休市日才顯示「休市」；不是的話，開盤後還沒拿到資料是「開盤 · 慢X分」，其餘為「收盤」
  // 台股集合競價（試撮）時段，台北時間的分鐘數：現貨 08:30-09:00、13:25-13:30；台指期 08:30-08:45。
  // 這段時間沒有新成交，數字維持上一筆，只把狀態改成「試撮」（試撮價在 MIS，robots.txt 禁止抓取，不用）
  const AUCTION = { stock: [[510, 540], [805, 810]], txf: [[510, 525]] };
  function inAuction(id) {
    const tw = new Date(Date.now() + 8 * 3600000);
    const mins = tw.getUTCHours() * 60 + tw.getUTCMinutes();
    return !isMarketHoliday('tw') && AUCTION[id === 'txf' ? 'txf' : 'stock'].some(([s, e]) => mins >= s && mins < e);
  }

  function effectiveState(q) {
    if (q.fault) return 'fault';  // 上游抓不到，顯示的是最後一次成功的數字
    if (MARKET_OF[q.id] === 'tw' && inAuction(q.id)) return 'auction';
    // Yahoo 的 USD/TWD 是國際參考報價，台灣休市日也算開盤；台北匯市沒交易，直接標休市
    if (q.id === 'usdtwd' && isMarketHoliday('tw')) return 'holiday';
    const market = MARKET_OF[q.id];
    if (!market || (q.state !== 'closed' && q.state !== 'holiday')) return q.state;
    if (isMarketHoliday(market)) return 'holiday';
    return q.state === 'holiday' ? 'opening' : 'closed';
  }

  // 盤後資料只進不退：Worker 在不同 Cloudflare 機房的快取可能一新一舊，2 分鐘後拿到比畫面上還舊的
  // 盤後數字（10/12 15:06 已是 10/12，15:08 又變回 10/8）時，保留畫面上較新的那份
  const newest = {};
  function pick(key, cur, dateOf) {
    const d = cur ? dateOf(cur) : null;
    const old = newest[key];
    if (old && (!d || d < old.d)) return old.v;
    if (d) newest[key] = { d, v: cur };
    return cur;
  }
  function keepNewest(data) {
    data.quotes = data.quotes.map((q) => (q.kind === 'daily' ? pick(`q:${q.id}`, q, (x) => (x.error ? null : x.time)) : q));
    data.institutional = pick('inst', data.institutional, (x) => x.date);
    data.vix = pick('vix', data.vix, (x) => x.closes?.at(-1)?.date);
    // 八大：除了這次開網頁期間不倒退，也記在這台裝置（localStorage），重開網頁、換到給舊資料的機房都不會退回舊日期
    try {
      const saved = JSON.parse(localStorage.getItem('govBanksNewest') ?? 'null');
      if (saved?.days?.length && !newest.govBanks) newest.govBanks = { d: saved.days.at(-1).date, v: saved };
    } catch {}
    data.govBanks = pick('govBanks', data.govBanks, (x) => x.days?.at(-1)?.date);
    try { if (data.govBanks?.days?.length) localStorage.setItem('govBanksNewest', JSON.stringify(data.govBanks)); } catch {}
    // 持股的外資／投信買賣超：同樣不倒退、記在這台裝置（10/17 有機房剛好沒存過又抓失敗，8:20-8:30 顯示「未公布」）
    try {
      const saved = JSON.parse(localStorage.getItem('flowsNewest') ?? 'null');
      for (const k of ['foreign', 'trust']) if (saved?.[k]?.date && !newest[`flows:${k}`]) newest[`flows:${k}`] = { d: saved[k].date, v: saved[k] };
    } catch {}
    const flows = { foreign: pick('flows:foreign', data.flows?.foreign, (x) => x.date), trust: pick('flows:trust', data.flows?.trust, (x) => x.date) };
    data.flows = flows.foreign || flows.trust ? flows : data.flows;
    try { if (flows.foreign || flows.trust) localStorage.setItem('flowsNewest', JSON.stringify(flows)); } catch {}
    // 新聞快訊：某個機房剛好抓失敗回空清單時，沿用這台裝置上次看到的，不讓整張卡消失
    try {
      if (data.jin10?.items?.length) localStorage.setItem('newsNewest', JSON.stringify(data.jin10));
      else data.jin10 = JSON.parse(localStorage.getItem('newsNewest') ?? 'null') ?? data.jin10;
    } catch {}
    try { localStorage.removeItem('newsTimes'); } catch {}  // 舊版「記住時間」：清單改存在 Worker 的 KV，全球一份，不需要了
    return data;
  }

  // 卡片名稱的可省略部分（例如「八大行庫買賣超」的「買賣超」）：實際量測放不下右上 badge 才隱藏，
  // 不用固定的螢幕寬度判斷（同一支手機的縮放比例不同，空間也不同）
  // 分類（台股盤中／國際市場／台股盤後）可以收合：點標題列切換，收合狀態記在這台裝置
  let collapsed = new Set();
  try { collapsed = new Set(JSON.parse(localStorage.getItem('collapsedSections') ?? '[]')); } catch {}
  function applyCollapsed() {
    let hide = false;
    for (const el of $list.children) {
      if (el.classList.contains('section')) {
        hide = collapsed.has(el.dataset.sec);
        el.classList.toggle('closed', hide);
        el.querySelector('.sec-tg').textContent = hide ? '▸' : '▾';
      } else if (!el.classList.contains('cal')) {
        el.classList.toggle('sec-hidden', hide);
      }
    }
  }

  function fitNames() {
    for (const x of $list.querySelectorAll('.nm-x')) {
      x.hidden = false;
      const head = x.closest('.head');
      // badge 空間不夠時是自己縮成「連…」，不會撐破 head，所以要檢查 head 裡每個元素有沒有被截斷
      const cut = (el) => el.scrollWidth > el.clientWidth;
      if (head && (cut(head) || [...head.children].some(cut))) x.hidden = true;
    }
    // 漲跌那一行、較前日那一行（例如加權跌破千點「-1,061.66 (-2.15%)」、「淨空增10,768口」）放不下時，字自動縮小到剛好放得下（最小 11px）；
    // 每次重畫都先恢復原本大小再量，所以漲跌變小時會自動變回來
    for (const el of $list.querySelectorAll('.card .chg, .card .cmp')) {
      el.style.fontSize = '';
      let size = parseFloat(getComputedStyle(el).fontSize);
      while (el.scrollWidth > el.clientWidth && size > 11) {
        size -= 0.5;
        el.style.fontSize = `${size}px`;
      }
    }
  }
  window.addEventListener('resize', () => fitNames());

  // 私人自選股張數（解鎖後才有；private-vault.js 加密存在這個瀏覽器）→「我的自選股」旁的今日增減 badge
  let privateLots = null;
  let lastRenderArgs = null;
  (async () => {
    if (!window.PrivateVault?.unlocked()) return;
    privateLots = await window.PrivateVault.readLots();
    if (privateLots && lastRenderArgs) render(...lastRenderArgs);
  })();
  // 最後一個交易日的市值變動 = Σ（現價 − 昨收）× 張數 × 1000，單位萬、小數 1 位。
  // 開盤後一直顯示（收盤後、半夜、週末、連假都看得到最後一個交易日的），直到下一個交易日 08:15 才隱藏，
  // 等開盤有今天的成交再出現。任一檔缺報價或故障就不顯示。不含當日交易、股利、稅費
  function privateBadge(list) {
    if (!privateLots) return '';
    const tw = new Date(Date.now() + 8 * 3600000);
    const today = tw.toISOString().slice(0, 10);
    const preOpen = !isMarketHoliday('tw') && tw.getUTCHours() * 60 + tw.getUTCMinutes() >= 8 * 60 + 15;
    let total = 0;
    let held = 0;
    for (const [code, lots] of Object.entries(privateLots)) {
      if (code === 'cost' || code === 'inv' || !(lots > 0)) continue;
      held++;
      const h = list.find((x) => x.code === code);
      const day = h?.time ? new Date(h.time + 8 * 3600000).toISOString().slice(0, 10) : null;
      if (!h || h.fault || !Number.isFinite(h.change)) return '';
      if (preOpen && day !== today) return '';  // 交易日 08:15 後、今天還沒成交：隱藏
      total += h.change * lots * 1000;
    }
    if (!held) return '';
    const wan = Math.abs(total) / 10000;
    if (Math.round(total) === 0) return '<span class="badge note">■ 0.00萬</span>';
    const amount = wan < 0.005 ? '<0.01' : wan.toFixed(2);
    return `<span class="badge ${total > 0 ? 'up' : 'down'}">${total > 0 ? '▲' : '▼'} ${amount}萬</span>`;  // 灰底、字紅綠
  }

  // 總損益（左、大）和今日增減（右、小）合成一顆分段膠囊：同一個外框才會切齊，中間一條細線分開
  function pnlCapsule(list) {
    const t = totalPnlBadge(list);
    const d = privateBadge(list);
    return t && d ? `<span class="pnl">${t}${d}</span>` : t || d;
  }

  // 總損益：跟券商庫存頁同一個算法——參考淨值（市值 ×（1 − 手續費 0.1425% − 證交稅））− 投入成本，單位萬。
  // 證交稅股票 0.3%、ETF 0.1%。舊版存的是損益兩平價：（現價 − 兩平價）× 股數 ×（1 − 手續費 − 稅），只到小數兩位會有誤差
  // 只算有填兩平價（私人頁）的；一檔都沒填就不顯示。賺紅、虧綠
  function totalPnlBadge(list) {
    const inv = privateLots?.inv ?? {};
    const cost = privateLots?.cost ?? {};
    let total = 0;
    let n = 0;
    for (const [code, lots] of Object.entries(privateLots ?? {})) {
      if (code === 'cost' || code === 'inv' || !(lots > 0) || !(inv[code] > 0 || cost[code] > 0)) continue;
      const h = list.find((x) => x.code === code);
      if (!h || h.fault || !Number.isFinite(h.price)) return '';
      const keep = 1 - 0.001425 - (code.startsWith('00') ? 0.001 : 0.003);  // 00 開頭是 ETF
      const shares = lots * 1000;
      total += inv[code] > 0 ? h.price * shares * keep - inv[code] : (h.price - cost[code]) * shares * keep;
      n++;
    }
    if (!n) return '';
    const wan = Math.abs(total) / 10000;
    if (Math.round(total) === 0) return '<span class="badge note">總 0.00萬</span>';
    const amount = wan < 0.005 ? '<0.01' : wan.toFixed(2);
    return `<span class="badge ${total > 0 ? 'up' : 'down'}">總 ${amount}萬</span>`;  // 不加 ▲▼，灰底、字紅綠
  }

  // 加權週 K（虛線＝月線）：每晚存的日開高低收（證交所） + 今天（盤中 15 分 K 的開高低、即時指數當收），依週（週一起算）分組，
  // 最近 18 週：開＝該週第一天開盤、高低＝該週最高最低、收＝該週最後一筆。舊資料沒有開高低時退回只用收盤
  let taiexKPage = 0;
  // 加權、費半共用：hist＝每晚存的日開高低收，today＝即時報價所屬的交易日（美股用美東日期）
  // n＝虛線用的均線天數（20 月線、60 季線）
  function weeklyCandles(twii, hist = taiexHistory?.closes, today = twii?.time ? new Date(twii.time + 8 * 3600000).toISOString().slice(0, 10) : null, n = 20) {
    const days = (hist ?? []).filter((c) => !today || c.date < today)
      .map((c) => ({ date: c.date, o: c.open ?? c.close, h: c.high ?? c.close, l: c.low ?? c.close, c: c.close }));
    if (today && twii.price) {
      const k = (twii.candles ?? []).filter(Boolean);
      days.push({ date: today, o: k[0]?.[0] ?? twii.price, h: Math.max(twii.price, ...k.map((x) => x[1])),
        l: Math.min(twii.price, ...k.map((x) => x[2])), c: twii.price });
    }
    const weeks = [];
    for (const d of days) {
      const t = new Date(`${d.date}T00:00:00Z`);
      const monday = new Date(t - ((t.getUTCDay() + 6) % 7) * 86400000).toISOString().slice(0, 10);
      const w = weeks.at(-1);
      if (w?.key !== monday) weeks.push({ key: monday, o: d.o, h: d.h, l: d.l, c: d.c });
      else { w.h = Math.max(w.h, d.h); w.l = Math.min(w.l, d.l); w.c = d.c; }
    }
    const bars = weeks.map((w) => [w.o, w.h, w.l, w.c]).slice(-18);
    if (bars.length < 2) return '';
    // 虛線＝月線（20 日均線）：每根週 K 對應該週最後一個交易日當時的月線，本週那點＝現在的月線（跟加權卡片下面的月線同一個數）
    const closes = days.map((d) => d.c);
    const ma20At = (i) => (i >= n - 1 ? closes.slice(i - n + 1, i + 1).reduce((a, b) => a + b, 0) / n : null);
    const lastIdx = [];
    days.forEach((d, i) => {
      const t = new Date(`${d.date}T00:00:00Z`);
      lastIdx[weeks.findIndex((w) => w.key === new Date(t - ((t.getUTCDay() + 6) % 7) * 86400000).toISOString().slice(0, 10))] = i;
    });
    const ma = weeks.map((_, i) => ma20At(lastIdx[i])).slice(-18);
    return miniCandles(bars, null, ma);
  }

  // 台股競猜（主帳號登入才有）：交易日 08:30-08:59 押今天加權漲或跌，09:00 前可以改；收盤後依加權漲跌開獎，平盤不計。
  // 押注存在 Worker（跨裝置同步，見 guessSync），這台裝置的 localStorage 當快取；勝負每次從加權歷史收盤（盤後今天用即時報價）重算，不另外存。
  // 有押的那天整天顯示（盤中只寫押什麼），到下一個交易日 08:30 換新的一局；沒押只放勝率（交易日 09:00 後寫「本日未押注」）。勝率一直顯示
  const GUESS_KEY = (account) => `guess-v1:${account}`;
  function guessPicks(account) {
    try { return JSON.parse(localStorage.getItem(GUESS_KEY(account))) ?? {}; } catch { return {}; }
  }
  // 跨裝置同步（Worker 的 /guess，KV 存一份）：打開頁面、回到前景時讀雲端，按下漲跌時寫上去；雲端為準。
  // 沒有同步金鑰（舊的登入、還沒重新登入）或連不上就只用這台的紀錄。今天這局還開著、雲端沒有但這台有（上次沒送成）就補送
  const GUESS_API = API.replace(/\/quotes$/, '/guess');
  async function guessSync(pick) {
    const token = window.PrivateVault?.syncToken?.();
    if (window.PrivateVault?.profile?.() !== 'owner' || !token) return;
    try {
      const res = await fetch(GUESS_API, pick
        ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Sync': token }, body: JSON.stringify({ pick }) }
        : { headers: { 'X-Sync': token }, cache: 'no-store' });
      const picks = (await res.json())?.picks;
      if (!picks) return;
      const tw = new Date(Date.now() + 8 * 3600000);
      const today = tw.toISOString().slice(0, 10);
      const local = guessPicks('owner');
      if (!pick && local[today] && !picks[today] && guessOpen(tw.getUTCHours() * 60 + tw.getUTCMinutes())) return guessSync(local[today]);
      try { localStorage.setItem(GUESS_KEY('owner'), JSON.stringify(picks)); } catch {}
      if (lastRenderArgs) render(...lastRenderArgs);
    } catch {}
  }
  const guessOpen = (mins) => !isMarketHoliday('tw') && mins >= 8 * 60 + 30 && mins < 9 * 60;
  // 某天加權收盤漲跌：1 漲、-1 跌、0 平盤、null 還不知道
  function taiexDir(day, twii) {
    const c = taiexHistory?.closes ?? [];
    const i = c.findIndex((x) => x.date === day);
    if (i > 0) return Math.sign(Math.round((c[i].close - c[i - 1].close) * 100));
    const tw = new Date(Date.now() + 8 * 3600000);
    const mins = tw.getUTCHours() * 60 + tw.getUTCMinutes();
    const today = tw.toISOString().slice(0, 10);
    if (twii?.time && twDate(twii.time) === day && (day < today || (mins >= 13 * 60 + 35 && twii.state === 'closed')) && Number.isFinite(twii.change)) {
      return Math.sign(Math.round(twii.change * 100));
    }
    return null;
  }
  function guessHtml(twii, account) {
    if (account !== 'owner') return '';  // 只有主帳號玩
    const tw = new Date(Date.now() + 8 * 3600000);
    const mins = tw.getUTCHours() * 60 + tw.getUTCMinutes();
    const today = tw.toISOString().slice(0, 10);
    const picks = guessPicks(account);
    let win = 0;
    let n = 0;
    for (const [d, p] of Object.entries(picks)) {
      const dir = taiexDir(d, twii);
      if (!dir) continue;  // 還沒開獎或平盤
      n++;
      if (dir === (p === 'up' ? 1 : -1)) win++;
    }
    const rate = `<span class="rate">勝率 ${n ? Math.round((100 * win) / n) : 0}% (共${n}次)</span>`;
    const card = (body) => `<div class="card wide flat guess"><div class="head"><div class="name">台股競猜</div><span class="gs">${body}</span></div></div>`;
    const pickTxt = (p) => `<span class="${p}">${p === 'up' ? '▲漲' : '▼跌'}</span>`;
    if (guessOpen(mins)) {
      const p = picks[today];
      const btn = (k) => `<button type="button" class="gb ${k}${p === k ? ' on' : ''}" data-guess="${k}">${k === 'up' ? '漲' : '跌'}</button>`;
      return card(`${p ? '<span class="gt">09:00 截止</span>' : '<span class="gt">今天加權？</span>'}${btn('up')}${btn('down')}`);
    }
    // 最近一局：今天 08:30 前看的是上一個交易日那局
    const last = Object.keys(picks).sort().at(-1);
    const lastTrade = twii?.time ? twDate(twii.time) : null;
    if (!last || (last !== today && last !== lastTrade) || (last !== today && !isMarketHoliday('tw') && mins >= 8 * 60 + 30)) {
      // 交易日 09:00 後今天沒押：整天寫「本日未押注」；其他時候只放勝率
      const trading = !isMarketHoliday('tw');
      return card(`${trading && mins >= 9 * 60 ? '<span class="gt">本日未押注</span>' : ''}${rate}`);
    }
    const p = picks[last];
    const dir = taiexDir(last, twii);
    let res = '';
    if (dir != null) res = dir === 0 ? '<span class="gt">平手</span>' : dir === (p === 'up' ? 1 : -1) ? '<span class="win">勝</span>' : '<span class="gt">負</span>';
    return card(`<span>押${pickTxt(p)}</span>${res}${rate}`);
  }

  function render(data, margin, profile) {
    lastRenderArgs = [data, margin, profile];
    data = keepNewest(data);
    margin = pick('margin', margin, (x) => x.date);
    announcements = data.announcements ?? null;
    if (data.holidays?.length) {
      holidays = new Map(data.holidays.map((h) => (typeof h === 'string' ? [h, ''] : [h.date, h.name])));
    }
    for (const q of data.quotes) q.state = effectiveState(q);
    const byId = Object.fromEntries(data.quotes.map((q) => [q.id, q]));
    const badges = {
      twii: turnoverBadge(byId.twii, profile),
      txf: basisBadge(byId.txf, byId.twii),
      us10y: us10yBadge(byId.us10y),
      usdtwd: usdtwdBadge(byId.usdtwd, data.institutional, instHistory),
      sox: monthLineBadge(byId.sox),
      kospi: monthLineBadge(byId.kospi),
      nikkei: monthLineBadge(byId.nikkei),
    };
    // 分類：台股盤中（加權起）、國際市場（費半起）、台股盤後（三大法人全寬卡片、台指VIX 起）
    const section = (title) => `<div class="section" data-sec="${title}"><span>${title}</span><span class="sec-tg">▾</span></div>`;
    const before = {
      twii: guessHtml(byId.twii, window.PrivateVault?.profile?.() ?? null) + section('台股盤中'),
      sox: section('國際市場'),
      retailRatio: section('台股盤後'),
    };
    // 登入的帳號：主帳號（owner）玩戰鎚小遊戲；love 帳號玩自己的小遊戲。
    // 我的自選股只有主帳號看得到（沒登入、love 帳號都隱藏）
    const account = window.PrivateVault?.profile?.() ?? null;
    // 插在某張卡片後面的卡片：台指期後接我的持股（全寬，排在加權、台指期那一排下面）；
    // 外資淨OI 後接台指VIX、八大行庫
    const after = {
      // 漲跌家數（一行的扁卡片）放在我的自選股上面
      txf: (byId.breadth && !byId.breadth.error ? breadthHtml(byId.breadth, byId.twii, data.holdings?.find((h) => h.code === '2330'), data.holdings?.find((h) => h.code === '00685L')) : '')
        + (account === 'owner' ? holdingsHtml(data.holdings, byId.twii, data.flows, data.govBanks) : ''),
      // 散戶多空比、外資淨OI 一排在最上面，接著三大法人（全寬），再來台指VIX、八大行庫
      foreignOi: institutionalHtml(data.institutional, instHistory) + vixHtml(data.vix, byId.twii) + govBanksHtml(data.govBanks, byId.twii),
    };
    // USD/TWD 是國際外匯報價，排到國際市場最後（美債後面）
    const quotes = data.quotes.filter((q) => q.id !== 'usdtwd' && q.id !== 'us10y');
    const fx = data.quotes.find((q) => q.id === 'usdtwd');
    // 國際市場：費半、美債（美股時段）／韓股、日經（亞洲時段）／布蘭特、USD/TWD，兩兩一排剛好三排，同一排開盤時間接近
    const us10y = data.quotes.find((q) => q.id === 'us10y');
    if (us10y) quotes.splice(Math.max(0, quotes.findIndex((q) => q.id === 'kospi')), 0, us10y);
    if (fx) quotes.splice(quotes.findIndex((q) => q.id === 'brent') + 1 || quotes.length, 0, fx);
    // 台股盤後依更新先後排：散戶多空比、外資淨OI（期交所 15:00）在前，台指VIX、八大行庫在後
    const rr = quotes.findIndex((q) => q.id === 'retailRatio');
    const oi = quotes.findIndex((q) => q.id === 'foreignOi');
    if (rr > oi && oi >= 0) quotes.splice(oi, 0, ...quotes.splice(rr, 1));
    const cardFor = (q) => {
      if (q.error) {
        // 抓不到又沒有舊資料可用：只寫「故障」，錯誤細節放在 title（長按 / 滑過可看）
        return `<div class="card"><div class="name">${q.name}</div><div class="meta" title="${esc(q.error)}"><span class="lag">故障</span></div></div>`;
      }
      if (q.kind === 'daily') return dailyHtml(q, data.institutional, data.flows, byId.twii, data.vix);
      if (q.kind === 'breadth') return '';  // 已經放在台指期後面（我的自選股上面）
      const dir = q.change > 0 ? 'up' : q.change < 0 ? 'down' : '';
      const sign = q.change > 0 ? '+' : '';
      const ageMin = Math.round((Date.now() - q.time) / 60000);
      const sameDay = new Date(q.time).toDateString() === new Date().toDateString();
      // Open: measured lag. Lunch: the feed's typical delay. Closed/holiday: none.
      // 開盤但還沒拿到今天的資料：慢的分鐘數＝開盤到現在
      const openingLag = q.sessionStart ? Math.max(1, Math.round((Date.now() - q.sessionStart) / 60000)) : q.delayMin;
      const lagMin = q.state === 'opening' ? openingLag
        : q.state === 'lunch' ? q.delayMin
        : STATE_LABELS[q.state] ? 0 : ageMin >= 5 && ageMin < 60 ? ageMin : 0;
      const lag = (STATE_LABELS[q.state] ? ` · ${STATE_LABELS[q.state]}` : '')
        + (lagMin ? ` · <span class="lag">慢${lagMin}分</span>` : '');
      const stale = q.stale && !q.fault ? ' · <span class="lag">舊資料</span>' : '';
      const chart = q.candles ? miniCandles(q.candles, q.prev) : '';
      // 沒有報價時間（例如 Yahoo 換到下一個交易時段）就不顯示時間，只留狀態
      // 收盤、休市等狀態只顯示時間，不加日期
      // 開盤但延遲報價還沒出來：最新一筆是昨天的收盤，不顯示時間
      // 早盤試撮時最新一筆是前一個時段的（現貨是昨天收盤、台指期是夜盤 05:00），不顯示時間
